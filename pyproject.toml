# OpenProcessor - Python Project Configuration
# Configuration for ruff (linter + formatter) and project metadata

[project]
name = "openprocessor"
version = "0.6.0"
description = "Self-hosted AI-powered visual processing engine with object detection, face recognition, CLIP embeddings, OCR, and vector search"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "OpenProcessor Contributors"}
]
license = {text = "AGPL-3.0-or-later"}

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.12",
]

keywords = ["yolo", "triton", "tensorrt", "object-detection", "face-recognition", "clip", "ocr", "visual-search", "fastapi", "inference", "openprocessor"]

dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.33",
    "orjson==3.13.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "ultralytics==8.4.208",
    "tritonclient[all]==2.74.0",
    "onnx==1.21.0",
    "onnxruntime-gpu==1.30.0",
    "cupy-cuda13x==14.2.0",
    "torch==2.15.0",
    "torchvision==0.29.1",
    "opencv-python==5.0.0.93",
    "simplejpeg==1.9.0",
    "pillow==13.0.0",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "requests==2.34.2",
    "aiohttp==3.14.5",
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "boto3==1.43.125",
    "botocore==1.43.125",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "pandas==3.1.1",
    "psutil==7.2.2",
    "tqdm==4.70.1",
    "tabulate==0.10.0",
    "pyyaml==6.0.3",
    "structlog==26.1.0",
    "tenacity==9.2.1",
    "opensearch-py==3.2.0",
    "transformers==5.22.2",
    "timm==1.0.31",
    "huggingface_hub==2.4.0",
    "ftfy==6.3.1",
    "open-clip-torch==4.2.1",  # F-13(b): MobileCLIP2 configs need >=3.2
    "faiss-gpu-cu12==1.14.1.post1",
    "imohash==1.1.0",
    "pyexiftool==0.5.6",
    "prometheus-client==0.26.0",
    "scikit-learn==1.9.1",
    "umap-learn==0.5.12",
    "hdbscan==0.8.44",
    "joblib==1.6.0",
    "einops==0.8.2",
    "cachetools==7.3.0",
    "regex==2026.9.29",
    "docker==7.2.0",
    "SQLAlchemy[asyncio]==2.1.8",
    "alembic==1.20.1",
    "psycopg[c]==3.3.8",
    "celery[redis]==5.7.0",
    "kombu==5.7.0",
    "billiard==4.3.2",
    "redis==8.1.0",
    "asgi-correlation-id==5.0.1",
    "flower==2.2.0",
]

[project.optional-dependencies]
# The engine-build toolchain: image-only (requirements-export.txt), installed on top of the
# runtime set into the export image.
export = [
    "tensorrt-cu13==11.4.0.106",
    "nvidia-modelopt[onnx]==0.48.0",
    "onnx-graphsurgeon==0.6.1",
    "onnxsim==0.8.1",
    "onnxslim==0.1.99",
    "onnxscript==0.7.2",
    "nvidia-ml-py==13.615.71",
]
# Install with `pip install --no-deps` (see Dockerfile): its own requirements
# exact-pin research packages that conflict with open-clip-torch>=3.2.
pe = [
    "perception_models @ git+https://github.com/facebookresearch/perception_models.git@3e352cca660658d4b5c90f42a7808b11469e4c66",
]
dev = [
    "pre-commit==4.7.0",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "vulture==2.16",
    "bandit[toml]==1.9.4",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "pytest-split==0.11.0",
    "coverage[toml]==7.17.2",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# =============================================================================
# Ruff Configuration (Linter + Formatter)
# =============================================================================

[tool.ruff]
# Target Python 3.12
target-version = "py312"

# Line length (industry standard: 88-100, we use 100)
line-length = 100

# Directories to include/exclude
include = [
    "src/**/*.py",
    "export/**/*.py",
    "models/**/*.py",
    "scripts/**/*.py",
    "tests/**/*.py",
    # Side-car container sources (trainer watcher, segmenter server, test
    # harness fakes). They ship as their own images rather than as part of
    # the app package, but they are first-party code and held to the same
    # lint bar.
    "docker/**/*.py",
    # Playwright e2e suite and docs-screenshot scripts under frontend/.
    "frontend/**/*.py",
]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "reference_repos",
    "pytorch_models",
    "cache",
    "benchmarks/results",
    "*.egg-info",
    "frontend/node_modules",
    "frontend/build",
    "frontend/.svelte-kit",
]
# Apply `exclude` even when pre-commit passes file paths explicitly.
force-exclude = true

# =============================================================================
# Ruff Linter Rules
# =============================================================================

[tool.ruff.lint]
# Enable rule categories (industry standard set)
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "N",     # pep8-naming
    "UP",    # pyupgrade (modernize Python code)
    "B",     # flake8-bugbear (detect common bugs)
    "A",     # flake8-builtins (shadowing builtins)
    "C4",    # flake8-comprehensions (better list/dict comprehensions)
    "DTZ",   # flake8-datetimez (timezone-aware datetime)
    "T10",   # flake8-debugger (no breakpoints in production)
    "EM",    # flake8-errmsg (better error messages)
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie (misc lints)
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes (enforce quote style)
    "RSE",   # flake8-raise (better exception raising)
    "RET",   # flake8-return (better return statements)
    "SIM",   # flake8-simplify (simplify code)
    "TID",   # flake8-tidy-imports
    "TCH",   # flake8-type-checking (optimize TYPE_CHECKING imports)
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib (prefer pathlib over os.path)
    "ERA",   # eradicate (remove commented-out code)
    "PL",    # pylint
    "PERF",  # perflint (performance anti-patterns)
    "RUF",   # ruff-specific rules
    "S110",  # try-except-pass (a swallowed error)
    "S112",  # try-except-continue (a swallowed error)
]

# Rules to ignore (with justification)
ignore = [
    "E501",    # Line too long (handled by formatter)
    "PLC0415", # Import should be at top-level (lazy imports for heavy deps)
    "PLR0913", # Too many arguments (common in ML code)
    "PLR0917", # Too many positional arguments (FastAPI endpoints take Query/Form parameters; same reason as PLR0913)
    "PLR0912", # Too many branches (common in validation logic)
    "PLR0915", # Too many statements (common in setup functions)
    "PLR2004", # Magic value comparison (common with thresholds)
    "N803",    # Argument name should be lowercase (allow numpy-style names)
    "N806",    # Variable should be lowercase (allow numpy-style names)
    "EM101",   # Exception must not use string literal (too strict)
    "EM102",   # Exception must not use f-string (too strict)
    "SIM108",  # Use ternary operator (readability preference)
    "RUF012",  # Mutable class attributes (common in Pydantic)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Allow unused variables when prefixed with underscore
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Entry-point scripts that must run before their imports are valid: the seed scripts put the
# repo root on sys.path first.
"scripts/curation/seed_docs_run_results.py" = ["E402"]
"scripts/curation/seed_docs_embeddings.py" = ["E402"]
"scripts/curation/seed_live_harness.py" = ["E402"]
# Standalone scripts put the repo root on sys.path before importing `src`/`scripts` (they run as
# `python scripts/...` from a checkout or the image), so their imports cannot precede that setup.
"scripts/bench/**/*.py" = ["E402"]
"scripts/research/**/*.py" = ["E402"]
"scripts/datasets/*.py" = ["E402"]
"scripts/curation/backfill_region_embeddings.py" = ["E402"]
"scripts/curation/backfill_scores.py" = ["E402"]
"scripts/curation/bulk_ingest.py" = ["E402"]
"scripts/curation/cluster_raw_labels.py" = ["E402"]
"scripts/curation/eval_regions_vs_gt.py" = ["E402"]
"scripts/curation/import_labeled_dataset.py" = ["E402"]
"scripts/curation/ingest_upload.py" = ["E402"]
"scripts/curation/prune_exports.py" = ["E402"]
"scripts/curation/prune_training_runs.py" = ["E402"]
"scripts/curation/reclassify_after_registry_growth.py" = ["E402"]
"scripts/curation/rederive_region_text.py" = ["E402"]
"scripts/curation/repair_empty_vlm_answers.py" = ["E402"]
"scripts/curation/repair_stale_label_source.py" = ["E402"]
"scripts/curation/repair_unmatched_class.py" = ["E402"]
"scripts/curation/requeue_regions.py" = ["E402"]
"scripts/curation/run_probe.py" = ["E402"]
"scripts/curation/seed_class_registry.py" = ["E402"]
"scripts/curation/worker/__main__.py" = ["E402"]
"scripts/purge_face_data.py" = ["E402"]
"scripts/validation/validate_models.py" = ["E402"]
# The whitelist is read by vulture, never run: each line is a bare attribute read on purpose.
"scripts/codegen/vulture_whitelist.py" = ["B018"]
# Tests that import a script or tool module by bare name put its directory on sys.path (or
# `pytest.importorskip` an optional dependency) first, so the import cannot precede that setup.
"tests/curation/test_backfill_region_embeddings.py" = ["E402"]
"tests/curation/test_mlflow_callbacks.py" = ["E402"]
"tests/curation/test_test_split_identity.py" = ["E402"]
"tests/curation/test_trainer_mlflow_guard.py" = ["E402"]
"tests/export/test_export_worker_command.py" = ["E402"]
"tests/export/test_ultralytics_export.py" = ["E402"]
"tests/installer/test_trt_build_target.py" = ["E402"]
"tests/records/test_holdout_freeze_route_pg.py" = ["E402"]
"tests/test_docs_screenshot_public_data_guard.py" = ["E402"]
"tests/test_docs_screenshot_seed.py" = ["E402"]
"tests/test_download_paddleocr_flow.py" = ["E402"]
"tests/test_export_config_write.py" = ["E402"]
"tests/test_export_face_recognition.py" = ["E402"]
"tests/test_export_paddleocr_rec.py" = ["E402"]
"tests/test_pe_download_weights.py" = ["E402"]
"tests/test_pe_image_encoder_export.py" = ["E402"]
"tests/test_pe_rearrange_shim.py" = ["E402"]
"tests/test_pe_rope_layout.py" = ["E402"]
"tests/test_pe_text_encoder_export.py" = ["E402"]
"tests/test_trt_build_settings.py" = ["E402"]
"tests/test_uint8_input.py" = ["E402"]
"tests/test_validate_pytorch_model_restricted.py" = ["E402"]
"tests/test_yolo_trt_build.py" = ["E402"]

# Test files can have additional flexibility
"tests/**/*.py" = [
    "A002",    # Argument shadows a builtin: fakes of the OpenSearch/Triton clients keep the real keyword (`id=`)
    "ARG001",  # Unused function argument (fixtures)
    "ARG002",  # Unused method argument: fakes and stubs implement the real collaborator's signature
    "ARG005",  # Unused lambda argument: monkeypatch replacements take the replaced callable's signature
    "PLR2004", # Magic values
    "PLW0108", # `lambda: Cls()` in dependency_overrides: FastAPI would read a bare class as a dependency with parameters
    "PT028",   # Default arguments in test-like functions (standalone test scripts, not pytest)
    "RUF001",  # Ambiguous Unicode characters (intentional for display)
    "TID251",  # Tests set and read os.environ directly; the ban is for src/
]

# Playwright e2e suite and docs-screenshot scripts: same latitude as tests/, plus the
# route-handler callback signatures Playwright dictates (unused request/match arguments).
"frontend/**/*.py" = [
    "ARG001",  # Unused function argument (fixtures, Playwright handler signatures)
    "ARG002",  # Unused method argument (same)
    "ARG005",  # Unused lambda argument (route handlers take (route, request))
    "PLR2004", # Magic values
    "PT018",   # Composite assertions carry a (values) message; splitting loses nothing worth the churn
    "PT028",   # Default arguments in test-like functions (standalone scripts)
    "RUF001",  # Ambiguous Unicode characters (asserting on rendered text)
    "RUF002",  # Ambiguous Unicode characters in docstrings
    "T201",    # print() allowed in the screenshot scripts
    "TID251",  # Separate program; the env ban is for src/
]

# Scripts can be less strict
"scripts/**/*.py" = [
    "T201",    # print() allowed in scripts
    "PLR2004", # Magic values
    "PT028",   # Default arguments in test-named functions (these are scripts, not pytest tests)
    "TID251",  # Scripts are separate programs; the env ban is for src/
]

# The side-car images and the export tools run outside the API process and do not import src/.
"docker/**/*.py" = ["TID251"]
# The one module that touches the environment.
"src/config/env.py" = ["TID251"]

# FastAPI routers use dependency injection in default arguments (standard pattern)
"src/routers/**/*.py" = [
    "B008",    # Function call in default argument (FastAPI File(), Depends(), Query())
    "PT028",   # Default arguments in endpoint functions (FastAPI pattern, not pytest)
]

# Utils package has documentation comments explaining import structure
"src/utils/__init__.py" = [
    "ERA001",  # Commented-out code (import documentation for circular dependency prevention)
]

# Export scripts for TensorRT plugins (third-party TRT NMS patterns)
"export/**/*.py" = [
    "ARG001",  # Unused arguments kept for interface consistency
    "ARG004",  # TensorRT plugin forward() requires all args for ONNX export
    "PT028",   # Default arguments in test-named functions (standalone scripts, not pytest)
    "TID251",  # Standalone tools that do not import src/
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# src reads the environment only through src/config/env.py (typed, fails closed
# on a malformed value). Everything outside src/ is exempted in per-file-ignores.
"os.environ".msg = "Read env through src.config.env (env_str/env_int/env_float/env_bool/env_path)."
"os.getenv".msg = "Read env through src.config.env (env_str/env_int/env_float/env_bool/env_path)."

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves these annotations at runtime, so their imports are not TYPE_CHECKING-only.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings", "src.services.curation.item_filter.ItemFilter"]
# FastAPI evaluates route-handler annotations at runtime to build dependencies and parameters, but
# ruff cannot see through `router.get(...)` (the router is an instance, not `fastapi.APIRouter`), so
# `runtime-evaluated-decorators` cannot express it. Exempting the modules that define the aliases
# and parameter models handlers are annotated with is the documented alternative
# (https://docs.astral.sh/ruff/settings/#lint_flake8-type-checking_exempt-modules).
exempt-modules = [
    "typing",
    "uuid",                                      # path/query parameter types
    "fastapi",                                   # UploadFile, Request, ... in handler signatures
    "src.core.db_session",                       # DbSessionDep
    "src.core.dependencies",                     # dependency aliases
    "src.routers.curation._item_filter_params",  # ItemFilterQuery
    "src.routers.curation._common_models",       # route request/response models
    "src.routers.curation._crop_write_models",
    "src.routers.curation._export_models",
    "src.routers.curation._health_models",
    "src.routers.curation._holdout_models",
    "src.routers.curation._ingest_config_models",
    "src.routers.curation._settings_models",
    "src.routers.curation._review_params",       # Annotated Query aliases used by review routes
    "src.routers.curation._class_models",
    "src.routers.curation._vlm_policy_models",
    "src.routers.curation._item_models",
    "src.routers.curation._common",              # OpenSearchDep
    "src.services.curation.vlm_policy",          # VlmScope query parameter
    "src.services.curation.dataset_import.options",
    "src.services.training.job_models",
    "src.config.projects",                       # ProjectRecord dependency return type
    "src.domain.embedding_state",                # EmbeddingState query parameter
    "src.services.curation.region_impact",
    "collections.abc",
]

[tool.ruff.lint.isort]
# Import sorting configuration (follows black/blue style)
force-single-line = false
lines-after-imports = 2
known-first-party = ["src"]
known-third-party = ["ultralytics", "tritonclient", "fastapi", "pydantic"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

# Combine 'from' imports from the same module
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-quotes]
# Use single quotes (blue style, more compact)
inline-quotes = "single"
multiline-quotes = "double"
docstring-quotes = "double"

[tool.ruff.lint.pylint]
# Pylint-specific settings
max-args = 10
max-branches = 15
max-returns = 8
max-statements = 60

# =============================================================================
# Ruff Formatter Configuration
# =============================================================================

[tool.ruff.format]
# Use single quotes (blue style)
quote-style = "single"

# Indent with spaces
indent-style = "space"

# Respect existing line endings
line-ending = "auto"

# Enable magic trailing comma (helps with git diffs)
skip-magic-trailing-comma = false

# Docstring formatting
docstring-code-format = true
docstring-code-line-length = 88

# =============================================================================
# Pytest Configuration
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    # Live write-path tests need the isolated harness in docker/test/ to be
    # up; they are deselected by default so the offline gate is unchanged.
    # Run them with: pytest tests/live -q --no-cov -m live
    # Database tests need a PostgreSQL (testcontainers, so Docker): pytest -m db
    "-m",
    "not live and not families and not db",
]
# Seconds per test: three times the slowest offline test (124 s measured under 6 parallel workers).
timeout = 400
# The signal timeout above reports only the main thread; a test still running at 300 s also dumps
# every thread's stack (once, nothing is killed), so a hang names the frame it waits in.
faulthandler_timeout = 300
markers = [
    "integration: tests that exercise several components together (no live stack required)",
    "live: write-path tests that require the docker/test/ verification harness to be running",
    "families: tests that need the official Ultralytics weights or the official YOLOv5 ONNX (CI job `families`); run with -m families",
    "unbound: opt out of the autouse `default` project binding (tests/conftest.py)",
    "events_server: db tests of the event cursor, set on every test that uses `pg_events`; with OP_TEST_EVENTS_DATABASE_URL they run alone: -m events_server -p no:xdist (the xdist tier uses -m 'db and not events_server')",
    "db: tests that need a PostgreSQL database (testcontainers or OP_TEST_DATABASE_URL); run with -m db",
]

# =============================================================================
# Coverage Configuration
# =============================================================================

[tool.coverage.run]
source = ["src", "scripts"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# =============================================================================
# MyPy Configuration (Type Checking)
# =============================================================================

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "docker", "export", "tests"]
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true  # tests/ is outside `files`, so it is exempt
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "export:docker/trainer:."
namespace_packages = true

# Test code: untyped test functions and fixtures are the norm (mypy docs, "Using mypy with an
# existing codebase" and config_file "Untyped definitions and calls": the disallow_* flags are
# per-module options). Bodies are still checked (check_untyped_defs stays on). No test module is
# skipped; scripts/codegen/check_mypy_tests.py explains how a temporary skip block is guarded.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false

# tests put export/ on sys.path and import `export_tasks` by its bare name; mypy would find
# the same file as `export.export_tasks` too and stop ("found twice"). Skip following the bare name.
[[tool.mypy.overrides]]
module = ["export_tasks"]
follow_imports = "skip"

# Ignore third-party packages without type stubs
[[tool.mypy.overrides]]
module = [
    "ultralytics.*",
    "tritonclient.*",
    "onnx.*",
    "onnxruntime.*",
    "tensorrt.*",
    "cv2.*",
    "opensearchpy.*",
    "transformers.*",
    "timm.*",
]
ignore_missing_imports = true

# =============================================================================
# Bandit Configuration (Security Linting)
# =============================================================================

[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "venv",
    "reference_repos",
    "pytorch_models",
    "cache",
]
skips = [
    "B101",  # assert_used - common in test files
    "B311",  # random - non-cryptographic jitter, sampling and shuffling (12 sites; a coded nosec on each would add noise)
    "B404",  # importing subprocess is advisory; each call is checked by B602/B603/B607
]

[tool.bandit.assert_used]
skips = ["*_test.py", "test_*.py"]
