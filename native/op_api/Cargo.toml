[package]
name = "op_api"
description = "Router assembly, middleware, error shapes, health, metrics and the forwarder, with one module per route family."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["http1", "json", "matched-path", "tokio"] }
http = { workspace = true }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "server-graceful", "service", "tokio"] }
op_config = { path = "../op_config" }
prometheus-client = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "signal", "sync", "time"] }
tower = { workspace = true, features = ["limit", "load-shed", "util"] }
tower-http = { workspace = true, features = ["catch-panic", "cors", "request-id", "trace"] }
tracing = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }
tokio-stream = { workspace = true }

[lints]
workspace = true
