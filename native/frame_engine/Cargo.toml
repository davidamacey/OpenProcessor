[package]
name = "frame_engine"
description = "The OpenProcessor frame engine: protocol version 1 over the general gpu_frame crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "op-frame-engine"
path = "src/main.rs"

[dependencies]
bytes = { workspace = true }
clap = { version = "=4.6.7", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
# PNG chunk checksums as Pillow checks them (host route, `host/png.rs`).
crc32fast = { workspace = true }
gpu_frame = { path = "../gpu_frame" }
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
# The host route's formats other than JPEG (plan 17 section 3, "Other host formats"): only the
# decoders whose output equals Pillow 13.0.0's on the corpus (tests/golden_host.rs).
image = { workspace = true, features = ["bmp", "gif", "ico", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
# Little CMS 2.19 (the version Pillow 13.0.0 bundles) built from the crate's vendored source for
# the colour step (plan 17 section 3, "Colour").
lcms2 = { version = "=6.2.0", features = ["static"] }
memchr = "=2.8.3"
# the SVD, determinant, rank and inverse of the face alignment (plan 17 section 3)
nalgebra = { version = "=0.35.0", default-features = false, features = ["std"] }
# PNG pixels with the checksum policy Pillow has (`host/png.rs`); the `image` crate fixes it.
png = { workspace = true }
prometheus-client = "=0.26.0"
procfs = { version = "=0.18.0", default-features = false }
op_local_file = { path = "../op_local_file" }
prost = { workspace = true }
# `OFlags::NONBLOCK` for opening a photo by key without blocking on a named pipe (`photo/read`).
rustix = { workspace = true, features = ["fs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { workspace = true }
sha2 = "=0.11.1"
# CMYK TIFF ink samples, converted as Pillow converts them (`host/formats.rs`).
tiff = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
tonic = { workspace = true, features = ["channel", "codegen", "router", "server"] }
tonic-prost = { workspace = true }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }
# libjpeg-turbo built from the crate's source unless TURBOJPEG_SOURCE=explicit points at the
# image's 3.1.2 build (plan 17 section 3); SIMD required, as the plan asks.
turbojpeg = { workspace = true, features = ["cmake", "require-simd"] }
# The strict host JPEG decode needs `tj3Set(TJPARAM_STOPONWARNING)`, which the safe crate does not
# expose (plan 17 section 3, "Host JPEG"); same library build as `turbojpeg` above.
turbojpeg-sys = { workspace = true }

[dev-dependencies]
base64 = "=0.22.1"
http = "=1.5.0"
hyper = { version = "=1.12.0", features = ["client", "http2"] }
tempfile = { workspace = true }

[build-dependencies]
prost-types = "=0.14.6"
protox = { workspace = true }
tonic-prost-build = { workspace = true }

[lints]
workspace = true
