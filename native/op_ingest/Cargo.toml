[package]
name = "op_ingest"
description = "The upload receiver, and the ingest pipeline with its commit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["json", "multipart"] }
bytes = { workspace = true }
futures-util = { workspace = true }
http-body-util = { workspace = true }
op_config = { path = "../op_config" }
op_storage = { path = "../op_storage" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tower-http = { workspace = true, features = ["limit", "timeout"] }
tracing = { workspace = true }
unicode-general-category = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
futures-util = { workspace = true, features = ["alloc"] }
op_upload_loadgen = { path = "../op_upload_loadgen" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "test-util"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
