# The native frame engine (docs/design/v070_rebuild/17_native_engine_plan.md).
# Workspace layout and inheritance: https://doc.rust-lang.org/cargo/reference/workspaces.html
[workspace]
members = [
    "gpu_frame",
    "frame_engine",
    "frame_engine_loadgen",
    "op_api",
    "op_config",
    "op_db",
    "op_engine_client",
    "op_ingest",
    "op_jobs",
    "op_media",
    "op_server",
    "op_storage",
    "op_upload_loadgen",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/davidamacey/OpenProcessor"
publish = false

# Exact pins (plan 17 section 3); features are chosen by each member. One entry per line,
# alphabetical, so the two crates' additions merge cleanly.
[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false }
bytes = "=1.12.1"
crossbeam-channel = "=0.5.17"
crc32fast = "=1.5.5"
cudarc = { version = "=0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "cuda-13020", "dynamic-loading"] }
futures-util = { version = "=0.3.34", default-features = false }
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false }
hyper-util = { version = "=0.1.21", default-features = false }
image = { version = "=0.25.10", default-features = false }
libloading = "=0.9.1"
murmur3 = "=0.5.2"
nvml-wrapper = "=0.13.0"
object_store = { version = "=0.14.2", default-features = false }
png = "=0.18.1"
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
prost = "=0.14.6"
protox = "=0.10.0"
reqwest = { version = "=0.13.5", default-features = false }
rustix = "=1.1.6"
rustls = { version = "=0.23.46", default-features = false }
# The one place serde_json's features are set: `float_roundtrip` on (floats parse correctly rounded,
# as Python's json.loads does), `arbitrary_precision` and `preserve_order` never (they change how
# other crates' wire models read); `op_config/tests/workspace_features.rs` guards both.
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.11.1"
tempfile = "=3.27.0"
tiff = "=0.11.3"
tokio = { version = "=1.54.1", default-features = false }
tonic = { version = "=0.14.9", default-features = false }
tonic-prost = "=0.14.9"
tonic-prost-build = "=0.14.9"
tracing = "=0.1.44"
turbojpeg = { version = "=1.5.1", default-features = false }
turbojpeg-sys = { version = "=1.2.0", default-features = false }
unicode-general-category = "=1.1.0"
uuid = { version = "=1.29.2", default-features = false }

# Lint levels for every member (`[lints] workspace = true`); the clippy names are in
# https://rust-lang.github.io/rust-clippy/stable/index.html. `unwrap` stays allowed inside
# tests through `allow-unwrap-in-tests` in clippy.toml.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

# Documentation lints of rustdoc, run by `cargo doc` (https://doc.rust-lang.org/rustdoc/lints.html).
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
# Complexity: thresholds in clippy.toml, matched to the Python gate (plan 17 section 3.1).
# Every suppression is an `#[expect(.., reason = "..")]`: it names why, and fails when the lint no
# longer fires (https://doc.rust-lang.org/reference/attributes/diagnostics.html#the-expect-attribute).
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
cognitive_complexity = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
missing_safety_doc = "deny"
too_many_lines = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

# A panic in one photo's work is caught per job and fails that photo (plan 17 section 1.3),
# which needs unwinding.
[profile.release]
panic = "unwind"

# The golden tests hash tens of thousands of weight sets: unoptimised, the digest and the
# weights' arithmetic dominate every test run.
[profile.dev.package.frame_engine]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 3

# The colour tests build 2^24-entry conversion tables through Little CMS.
[profile.dev.package.lcms2-sys]
opt-level = 3
