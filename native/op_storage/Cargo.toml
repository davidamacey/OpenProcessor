[package]
name = "op_storage"
description = "Key layout, landing zone, local read paths, streaming SHA-256, the durable object store, the mover, derived files and cache, delete and erase primitives, and reconcile listing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes = { workspace = true }
futures-util = { workspace = true }
# S3 without aws-lc: `aws-base` + `reqwest` + `ring` instead of the crate's `aws` feature, TLS by
# rustls with the ring provider (reqwest's `rustls-no-provider`; the provider is installed in
# `durable`). aws-lc-sys carries the OpenSSL licence, which native/deny.toml does not allow.
object_store = { workspace = true, features = ["aws-base", "fs", "reqwest", "ring"] }
op_config = { path = "../op_config" }
reqwest = { workspace = true, features = ["native-tls"] }
rustix = { workspace = true, features = ["fs"] }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt"] }
uuid = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
