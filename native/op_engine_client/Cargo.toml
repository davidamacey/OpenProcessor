[package]
name = "op_engine_client"
description = "The engine protocol v1 client: BYTES codec, plan builder, answer parser, channel pool and readiness, plus the model server readiness and load calls."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes = { workspace = true }
op_config = { path = "../op_config" }
prost = { workspace = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { workspace = true }
tonic = { workspace = true, features = ["channel", "codegen"] }
tonic-prost = { workspace = true }

[dev-dependencies]
base64 = "=0.22.1"
sha2 = "=0.11.1"

[build-dependencies]
protox = { workspace = true }
tonic-prost-build = { workspace = true }

[lints]
workspace = true
