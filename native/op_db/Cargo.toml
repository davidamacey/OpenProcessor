[package]
name = "op_db"
description = "The database pool, the per-project transaction, the statement registry, the `LISTEN` connection, and the test harness that loads the schema dump."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The database tier: `op_db::testing` starts PostgreSQL in a container (Docker needed). Off by
# default so the commit hooks and `cargo test --workspace` need no Docker.
db = ["dep:testcontainers-modules"]

[dependencies]
deadpool-postgres = { workspace = true }
op_config = { path = "../op_config" }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = { workspace = true }
serde_json = { workspace = true }
testcontainers-modules = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-postgres = { workspace = true, features = ["with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = { workspace = true, features = ["ring"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["std"] }

[dev-dependencies]
rcgen = { workspace = true, features = ["crypto", "pem", "ring"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "test-util", "time"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }

[lints]
workspace = true
