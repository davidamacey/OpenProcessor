[package]
name = "op_server"
description = "The `op-server` binary and its roles: `api`, `worker`, `periodic` and `migrate`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "op-server"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive", "error-context", "help", "std", "usage"] }
op_api = { path = "../op_api" }
op_config = { path = "../op_config" }
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "json", "std"] }

[dev-dependencies]
libtest-mimic = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "process"
harness = false

[lints]
workspace = true
