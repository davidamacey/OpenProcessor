# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/checks/cfg.html
# Hooks and CI run `cargo deny check licenses bans sources`; advisories need the RustSec database
# (network) and run at pre-push and in CI.

[graph]
all-features = true
# Only the targets this project ships are checked (docs: https://embarkstudios.github.io/cargo-deny/checks/cfg.html#the-targets-field),
# so crates that only wasm or Android builds need (rustls-platform-verifier's webpki-root-certs) are not.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[licenses]
# Each licence is compatible with this repository's AGPL-3.0-or-later (LICENSE; pyproject.toml
# `license`): https://www.gnu.org/licenses/license-list.html
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.93

# The workspace's own crates are AGPL and `publish = false`.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = []
