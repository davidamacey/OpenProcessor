# Gateway sub-path routes for the monitoring UIs. Installed into
# /etc/nginx/gateway.d/ by docker-entrypoint.sh ONLY when OP_GATEWAY_SUBPATHS is
# true; nginx.conf includes that directory inside the server block.
#
# Every upstream is a bare compose service name (validated by the entrypoint):
# these locations can never reach an address outside the compose network.
# Variable-form proxy_pass + the resolver in nginx.conf, as for the API, so a
# stopped or restarted UI only 502s its own sub-path.
#
# Grafana, Prometheus and OpenSearch Dashboards are configured to serve FROM
# their sub-path (OP_GATEWAY_SUBPATHS in docker-compose.yml), so the request URI
# is passed through unchanged. MLflow is left on its normal root (its UI uses
# relative URLs, and --static-prefix would also move /health and /api, breaking
# the trainer's and API's in-network MLFLOW_TRACKING_URI), so /mlflow is stripped
# before the upstream.
#
# Host and X-Forwarded-* carry the original client host, as on every API
# location; MLflow is the one exception for Host (see its location).

set $grafana_upstream __GRAFANA_UPSTREAM__;
set $prometheus_upstream __PROMETHEUS_UPSTREAM__;
set $dashboards_upstream __DASHBOARDS_UPSTREAM__;
set $mlflow_upstream __MLFLOW_UPSTREAM__;

location = /grafana {
    return 301 /grafana/;
}
# Grafana Live: a long-lived websocket.
location ^~ /grafana/api/live/ {
    proxy_pass $grafana_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
}
location ^~ /grafana/ {
    proxy_pass $grafana_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
}

location = /prometheus {
    return 301 /prometheus/;
}
location ^~ /prometheus/ {
    proxy_pass $prometheus_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
}

location = /dashboards {
    return 301 /dashboards/;
}
location ^~ /dashboards/ {
    proxy_pass $dashboards_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
}

location = /mlflow {
    return 301 /mlflow/;
}
# MLflow 3 answers 403 "Invalid Host header" to a Host outside
# MLFLOW_SERVER_ALLOWED_HOSTS. The gateway is the only caller, so it sends the
# upstream's own name (always on that list) instead of the browser's host, which
# would need every LAN name or address added; the browser's host still travels
# in X-Forwarded-Host.
location ^~ /mlflow/ {
    rewrite ^/mlflow/(.*)$ /$1 break;
    proxy_pass $mlflow_upstream;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    client_max_body_size 2048m;
}
