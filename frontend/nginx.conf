server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker's embedded DNS lives at 127.0.0.11. Without `resolver` +
    # variable-based proxy_pass, nginx resolves the API host ONCE at
    # worker start and pins the IP — so any restart/recreate of
    # the API container silently 502s every API request from the labeler SPA
    # until nginx is reloaded. The bug surfaced 2026-05-17 during the
    # Phase 1 round-trip test. The variable form below forces nginx to
    # re-resolve on every request (cached for `valid=10s`).
    resolver 127.0.0.11 valid=10s ipv6=off;
    # __API_UPSTREAM__ is substituted at container start (docker-entrypoint.sh).
    set $api_upstream __API_UPSTREAM__;

    # Ingest uploads (docs/design/ingest-ui-and-acceptance-plan-2026-09-24.md
    # §A.4): a 128-image batch with detector + embedding inference can
    # exceed the general API location's 120s read timeout below, and the
    # default 1 MB client_max_body_size rejects any realistic upload
    # before it even reaches the backend. A regex `location` (the `~`
    # modifier) is matched in declaration order, so this MUST be
    # declared before the general `^__API_PREFIX__/` location below or
    # it would never be reached (nginx doesn't reliably support nesting
    # a regex location inside another regex location, so this is a
    # sibling block rather than the nested one an earlier draft of this
    # plan sketched). __INGEST_MAX_REQUEST_MB__ is substituted at
    # container start from CROPWRIGHT_INGEST_MAX_REQUEST_MB (default
    # 256) — the same value the bundled JS reads via
    # window.__CROPWRIGHT_INGEST_MAX_REQUEST_MB__ so the client-side
    # planner and this limit can never drift apart.
    location ~ ^__API_PREFIX__/ingest/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        client_max_body_size __INGEST_MAX_REQUEST_MB__m;
        # Stream the upload straight to the upstream instead of
        # buffering the whole multipart body on disk/memory first —
        # nginx's default buffering adds latency and disk pressure for
        # a large batch for no benefit here (the backend already reads
        # the whole request into memory itself).
        proxy_request_buffering off;
    }

    # Proxy API traffic to the OpenProcessor API service so the browser
    # never makes cross-origin requests regardless of which LAN IP it uses to
    # reach the labeler. PUBLIC_TRITON_API_URL can stay empty in production.
    #
    # Critical: the regex must NOT match the labeler's own page routes like
    # /clusters/4 (Svelte route /clusters/[id]) — those have to pass through
    # to the SPA's index.html fallback. We only proxy the actual backend
    # endpoint prefix, substituted at container start (see
    # docker-entrypoint.sh) from the same PUBLIC_API_PREFIX/__API_PREFIX__
    # value the bundled JS composes its URLs from — default __API_PREFIX__
    # (/curation) so this location and api.ts's API_PREFIX never
    # drift apart.
    location ~ ^__API_PREFIX__/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        client_max_body_size __INGEST_MAX_REQUEST_MB__m;
    }

    # index.html must NEVER be cached: it's the SPA entrypoint that points at
    # the content-hashed JS/CSS chunks below. If the browser caches it, a new
    # deploy's hashed chunks are never discovered and the user keeps running
    # the OLD bundle across normal refreshes (the cause of stale-UI bugs like
    # "mark false-positive reverts" — old code re-fetched page 1). Force a
    # revalidate so every load picks up the latest build.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}
