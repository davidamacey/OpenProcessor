server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # nginx listens on 8080 inside the container; the published port differs. Without
    # this a `return 301 /grafana/;` becomes http://<host>:8080/grafana/, a port the
    # browser cannot reach.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    include /etc/nginx/snippets/security-headers.conf;

    # Docker's embedded DNS lives at 127.0.0.11. Without `resolver` +
    # variable-based proxy_pass, nginx resolves the API host ONCE at
    # worker start and pins the IP — so any restart/recreate of
    # the API container silently 502s every API request from the labeler SPA
    # until nginx is reloaded. The bug surfaced 2026-05-17 during the
    # Phase 1 round-trip test. The variable form below forces nginx to
    # re-resolve on every request (cached for `valid=10s`).
    resolver 127.0.0.11 valid=10s ipv6=off;
    # __API_UPSTREAM__ is substituted at container start (docker-entrypoint.sh).
    set $api_upstream __API_UPSTREAM__;

    # Ingest uploads (docs/design/ingest-ui-and-acceptance-plan-2026-09-24.md
    # §A.4): a 128-image batch with detector + embedding inference can
    # exceed the general API location's 120s read timeout below, and the
    # default 1 MB client_max_body_size rejects any realistic upload
    # before it even reaches the backend. A regex `location` (the `~`
    # modifier) is matched in declaration order, so this MUST be
    # declared before the general `^__API_PREFIX__/` location below or
    # it would never be reached (nginx doesn't reliably support nesting
    # a regex location inside another regex location, so this is a
    # sibling block rather than the nested one an earlier draft of this
    # plan sketched). __INGEST_MAX_REQUEST_MB__ is substituted at
    # container start from CROPWRIGHT_INGEST_MAX_REQUEST_MB (default
    # 256) — the same value the bundled JS reads via
    # window.__CROPWRIGHT_INGEST_MAX_REQUEST_MB__ so the client-side
    # planner and this limit can never drift apart.
    # Every ingest route is project-scoped ({prefix}/projects/<slug>/ingest/...);
    # the unscoped /ingest/ alias no longer exists.
    location ~ ^__API_PREFIX__/projects/[^/]+/ingest/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        client_max_body_size __INGEST_MAX_REQUEST_MB__m;
        # Stream the upload straight to the upstream instead of
        # buffering the whole multipart body on disk/memory first —
        # nginx's default buffering adds latency and disk pressure for
        # a large batch for no benefit here (the backend already reads
        # the whole request into memory itself).
        proxy_request_buffering off;
    }

    # Dataset archive uploads (OpenProcessor W10, docs/design/
    # w10-import-reprocess-ui-plan-2026-09-27.md §6): one multipart
    # .zip/.tar/.tar.gz, streamed to the backend, up to
    # __DATASET_UPLOAD_MAX_MB__ (CROPWRIGHT_DATASET_UPLOAD_MAX_MB, default
    # 2048 — the backend's own default cap is 2 GiB). The client reads the
    # same value via window.__CROPWRIGHT_DATASET_UPLOAD_MAX_MB__ and
    # refuses a larger file before sending. Declared before the general
    # API location (regex locations match in declaration order).
    location ~ ^__API_PREFIX__/projects/[^/]+/datasets/uploads$ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        client_max_body_size __DATASET_UPLOAD_MAX_MB__m;
        proxy_request_buffering off;
    }

    # Proxy API traffic to the OpenProcessor API service so the browser
    # never makes cross-origin requests regardless of which LAN IP it uses to
    # reach the labeler. PUBLIC_TRITON_API_URL can stay empty in production.
    #
    # Critical: the regex must NOT match the labeler's own page routes like
    # /clusters/4 (Svelte route /clusters/[id]) — those have to pass through
    # to the SPA's index.html fallback. We only proxy the actual backend
    # endpoint prefix, substituted at container start (see
    # docker-entrypoint.sh) from the same PUBLIC_API_PREFIX/__API_PREFIX__
    # value the bundled JS composes its URLs from — default __API_PREFIX__
    # (/curation) so this location and api.ts's API_PREFIX never
    # drift apart.
    location ~ ^__API_PREFIX__/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        client_max_body_size __INGEST_MAX_REQUEST_MB__m;
    }

    # Documentation: the one docs site (the `docs` service of docker-compose.docs.yml,
    # built for base path /OpenProcessor/, with Cropwright as a section of it). Variable
    # form, like the API: if the docs container is absent or restarted nginx still
    # starts and just answers 502 here.
    # __DOCS_UPSTREAM__ comes from DOCS_UPSTREAM (docker-entrypoint.sh).
    set $docs_upstream __DOCS_UPSTREAM__;
    location = /OpenProcessor {
        return 301 /OpenProcessor/;
    }
    location ^~ /OpenProcessor/ {
        proxy_pass $docs_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # The docs embed their own architecture diagrams in same-origin iframes, so this
        # location allows same-origin framing (the server-level DENY would blank them). A
        # location that sets add_header drops the inherited ones, so the rest are restated.
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }

    # The API's own interactive docs, served by the backend at ITS root
    # (FastAPI: Swagger UI, ReDoc, the schema and the Swagger OAuth
    # redirect page, and the /docs-assets/ bundles). Exact matches plus that
    # one asset prefix, so no SPA route (all under /p/ and
    # /projects) can be shadowed. The security-headers snippet sets no CSP,
    # so Swagger UI's CDN assets load without an override here.
    # Every API location (these and the __API_PREFIX__ ones above) sends Host and
    # X-Forwarded-Host as $http_host, the host the client used WITH its port
    # ($host drops it): the backend builds its service links (Grafana,
    # MLflow, ...) for GET /settings from it.
    location = /docs {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
    location = /docs/oauth2-redirect {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
    location = /redoc {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
    location = /openapi.json {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
    # FastAPI's own static assets for the docs pages live under /docs-assets/.
    location ^~ /docs-assets/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Gateway sub-path routes for the monitoring UIs (/grafana/, /prometheus/,
    # /dashboards/, /mlflow/): docker-entrypoint.sh installs nginx-gateway.conf
    # here only when OP_GATEWAY_SUBPATHS is true; otherwise the directory is empty.
    include /etc/nginx/gateway.d/*.conf;

    # index.html must NEVER be cached: it's the SPA entrypoint that points at
    # the content-hashed JS/CSS chunks below. If the browser caches it, a new
    # deploy's hashed chunks are never discovered and the user keeps running
    # the OLD bundle across normal refreshes (the cause of stale-UI bugs like
    # "mark false-positive reverts" — old code re-fetched page 1). Force a
    # revalidate so every load picks up the latest build.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # SvelteKit's version poll (kit.version.pollInterval) compares this file
    # with the one baked into the running bundle. Served by `location /`
    # with no Cache-Control it is eligible for heuristic caching, which would
    # hide a new deploy from the check.
    location = /_app/version.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Not `immutable`: the entrypoint rewrites these hashed JS/CSS chunks'
    # *contents* at container start (PUBLIC_API_PREFIX substitution) without
    # changing their filenames, so `immutable` would tell the browser to keep
    # serving a stale chunk across a config change. A long max-age still
    # gives the usual hashed-asset caching win.
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000" always;
    }
}
