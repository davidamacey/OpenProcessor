server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy API traffic to the openprocessor (op-api) service so the browser
    # never makes cross-origin requests regardless of which LAN IP it uses to
    # reach the labeler. PUBLIC_TRITON_API_URL can stay empty in production.
    #
    # Critical: the regex must NOT match the labeler's own page routes like
    # /clusters/4 (Svelte route /clusters/[id]) — those have to pass through
    # to the SPA's index.html fallback. We only proxy the actual openprocessor
    # endpoint patterns: /curation/* and the legacy /clusters/{train|assign|stats}/*
    # FAISS endpoints (the labeler still calls /clusters/stats/op_vehicles).
    location ~ ^/curation/ {
        proxy_pass http://op-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
    location ~ ^/clusters/(train|assign|stats)/ {
        proxy_pass http://op-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}
