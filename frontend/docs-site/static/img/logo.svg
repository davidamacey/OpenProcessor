<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="256" height="256">
  <rect width="128" height="128" rx="24" fill="#09090b"/>
  <!-- three sorted crop tiles, offset like stacked/organized piles -->
  <rect x="26" y="70" width="30" height="30" rx="5" fill="#3f3f46"/>
  <rect x="60" y="70" width="30" height="30" rx="5" fill="#3f3f46"/>
  <rect x="94" y="70" width="0" height="30" rx="5" fill="#3f3f46"/>
  <rect x="26" y="34" width="30" height="30" rx="5" fill="#60a5fa"/>
  <rect x="60" y="34" width="30" height="30" rx="5" fill="#f59e0b"/>
  <rect x="94" y="34" width="0" height="0" rx="5" fill="#3f3f46"/>
  <!-- little check mark on the blue tile signifying "labeled" -->
  <path d="M33 49 l6 6 l12 -12" fill="none" stroke="#09090b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
