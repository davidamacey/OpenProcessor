# Shared security headers. nginx does NOT inherit server-level add_header
# directives into a location block that sets its own add_header — so every
# location below that emits Cache-Control must also `include` this snippet,
# or it silently serves with no security headers at all (the bug this file
# fixes: `/` and `/clusters`, served by the try_files fallback, previously
# got nothing).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
