# Cropwright frontend. Joins the OpenProcessor API's docker network so
# nginx can proxy ${PUBLIC_API_PREFIX}/* to it by container name — no
# CORS, and the browser only ever talks to this origin.
#
#   docker compose up -d --build
#
# PUBLIC_API_PREFIX must equal the API's OP_API_PREFIX: the API builds
# some URLs itself (region thumbnails) from its own prefix.
#
# Running a second, independent instance alongside this one (e.g. a
# second dataset/deployment on the same host): give it its own compose
# project name, container name and host port so nothing collides —
#
#   CROPWRIGHT_PORT=5199 CROPWRIGHT_CONTAINER_NAME=cw-second \
#     OP_DOCKER_NETWORK=some_other_openprocessor_net \
#     docker compose -p cw-second up -d --build
services:
  cropwright:
    build: .
    container_name: ${CROPWRIGHT_CONTAINER_NAME:-cropwright}
    restart: unless-stopped
    environment:
      - PUBLIC_API_PREFIX=${PUBLIC_API_PREFIX:-/curation}
      - API_UPSTREAM=${API_UPSTREAM:-http://op-api:8000}
      # Leave empty to use the nginx proxy; set only to call an API on
      # a different origin directly from the browser.
      - PUBLIC_TRITON_API_URL=${PUBLIC_TRITON_API_URL:-}
      # Deployment-owned nginx upload cap for /ingest, in MB (default 256).
      - CROPWRIGHT_INGEST_MAX_REQUEST_MB=${CROPWRIGHT_INGEST_MAX_REQUEST_MB:-256}
    ports:
      - '${CROPWRIGHT_PORT:-5184}:8080'
    healthcheck:
      # 127.0.0.1, not localhost: localhost resolves to ::1 here and
      # nginx only listens on IPv4. The image runs nginx as uid 101 on 8080.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - api

networks:
  api:
    external: true
    name: ${OP_DOCKER_NETWORK:-openprocessor_triton_net}
