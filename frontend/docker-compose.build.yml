# Development overlay: build from source instead of pulling the published
# image. Deliberately NOT docker-compose.override.yml — that file auto-loads,
# which would make a user who just cloned the repo silently build instead of
# pull. Explicit opt-in:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  cropwright:
    build: .
    image: cropwright-dev:local
  docs:
    build: docs-site
    image: cropwright-docs-dev:local
