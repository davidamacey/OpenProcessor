name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (svelte-check + tsc)
        run: npm run check

      - name: Lint (prettier + eslint)
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Harmless in CI: the OpenProcessor checkout this compares against
      # (../openprocessor by default) isn't present here, so contract-sync.mjs
      # prints a skip message and exits 0 — see contracts/openprocessor/SOURCE.md.
      - name: Contract drift check (local-only; skips when the backend repo is absent)
        run: npm run contract:check

      - name: Build
        run: npm run build

      - name: py_compile scripts/ and e2e/
        run: python3 -m py_compile scripts/*.py e2e/*.py e2e/stubbed/*.py e2e/fixtures/*.py e2e/live/*.py

  e2e-stubbed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Ensure the browser dependencies apt needs are present
        run: |
          python3 -m venv e2e/.venv
          e2e/.venv/bin/pip install -q -r e2e/requirements.txt
          e2e/.venv/bin/playwright install --with-deps chromium

      - name: Stubbed e2e suite (fail-closed against a built preview server)
        run: npm run test:e2e

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a CHANGELOG.md entry when src/ or scripts/ change
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="$BASE_SHA...$HEAD_SHA"
          elif git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            RANGE="$BEFORE_SHA...$AFTER_SHA"
          else
            # First push of a new branch, or before-SHA not reachable
            # (force-push, shallow history): nothing safe to diff against.
            echo "No usable base SHA to diff against; skipping."
            exit 0
          fi

          CHANGED="$(git diff --name-only $RANGE)"
          echo "Changed files:"
          echo "$CHANGED"

          LAST_MSG="$(git log -1 --format=%B "$AFTER_SHA")"
          if echo "$LAST_MSG" | grep -qF '[skip-changelog]'; then
            echo "Last commit message contains [skip-changelog]; skipping."
            exit 0
          fi

          if echo "$CHANGED" | grep -qE '^(src|scripts)/' \
             && ! echo "$CHANGED" | grep -qx 'CHANGELOG.md'; then
            echo "::error::This push/PR changes src/ or scripts/ but does not update CHANGELOG.md. Add an entry under ## [Unreleased] (see CLAUDE.md's 'Documentation & changelog discipline'), or add [skip-changelog] to the last commit message if this truly has no user-facing/architectural effect."
            exit 1
          fi
