version: 2
# Grouped so this stays low-noise: one weekly npm PR (minor+patch), one
# weekly npm PR for majors, one monthly github-actions PR, one monthly
# docker base-image PR. `applies-to` is declared twice per group
# (version-updates and security-updates) because a bare `groups:` block
# only covers version-updates by default — without the second entry, a
# security advisory bypasses grouping and opens its own one-off PR.
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: ['minor', 'patch']
      npm-minor-patch-security:
        applies-to: security-updates
        patterns: ['*']
      npm-major:
        applies-to: version-updates
        update-types: ['major']
    ignore:
      # eslint/@eslint/js/typescript-eslint major-bump ignore removed
      # 2026-09-26 (build/deps-majors): typescript-eslint 8.70.1 already
      # declares `eslint: ^8.57.0 || ^9.0.0 || ^10.0.0` on the registry, so
      # the stale-peer conflict this used to guard against no longer
      # applies — verified live by bumping eslint/@eslint/js to ^10 and
      # eslint-plugin-svelte to ^3 in the same pass with a clean
      # `npm install` (no ERESOLVE).
      # TypeScript 7 is a hard npm ERESOLVE conflict: svelte-check's latest
      # (4.7.6) and @sveltejs/kit both still declare their typescript peer
      # as `^5.0.0 || ^6.0.0` (verified against the registry 2026-09-26).
      # transcribe-app/frontend hit the same wall and reverted (e851c207).
      # Un-ignore once svelte-check ships TS 7 peer support.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ['*']
      github-actions-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    groups:
      docker:
        applies-to: version-updates
        patterns: ['*']
      docker-security:
        applies-to: security-updates
        patterns: ['*']

  # docs-site/ is a standalone Docusaurus project with its own lockfile and
  # Dockerfile, shipped to GitHub Pages and the cropwright-docs container.
  - package-ecosystem: 'npm'
    directory: '/docs-site'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    groups:
      docs-npm-minor-patch:
        applies-to: version-updates
        update-types: ['minor', 'patch']
      docs-npm-minor-patch-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: 'docker'
    directory: '/docs-site'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 2
    groups:
      docs-docker:
        applies-to: version-updates
        patterns: ['*']
      docs-docker-security:
        applies-to: security-updates
        patterns: ['*']
