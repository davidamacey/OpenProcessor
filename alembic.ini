# Alembic configuration. There is no database URL here: the runner (scripts/db/migrate.py)
# builds it from the owner secret and hands the open connection to the environment script.
[alembic]
script_location = %(here)s/src/db/migrations
file_template = %%(rev)s
prepend_sys_path = .
path_separator = os
# Revision ids are fixed in the plan and passed with --rev-id; they are not dated hashes.
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
