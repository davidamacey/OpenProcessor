# =============================================================================
# Live write-path verification harness — isolated, disposable, never the
# production stack.
#
# Always invoke with the explicit project name so nothing can collide with
# a real deployment's containers/volumes/network:
#
#   docker compose -p op-live-verify -f docker/test/compose.yml up -d --wait
#   docker compose -p op-live-verify -f docker/test/compose.yml down -v --remove-orphans
#
# Design constraints (see README.md in this directory):
#   * host ports live in the 147xx band, outside every band a real
#     deployment or another project on this host uses;
#   * every OpenSearch index name is `verify_`-prefixed, so even a
#     mis-wired OPENSEARCH_URL cannot write into real data;
#   * the API runs --workers=1 because several cancel endpoints and the
#     SSE hub keep in-process state — with 2 workers a cancel POST can
#     land on a different worker than the start POST;
#   * /var/run/docker.sock is NEVER mounted. The GPU arbiter is a no-op
#     in this repo and must stay one; the harness proves that by leaving
#     it no socket to talk to.
# =============================================================================

name: op-live-verify

# The environment of every process that runs the api image (the API, Celery, the workers).
x-process-env: &process-env
  OP_DB_HOST: postgres
  OP_DB_NAME: openprocessor
  OP_DB_APP_PASSWORD_FILE: /run/secrets/op_pg/app_password
  OP_QUEUE_URL: redis://valkey:6379/0
  OP_QUEUE_PASSWORD_FILE: /run/secrets/op_valkey/password
  # The app reads `opensearch_url` (src/config/settings.py, env_prefix
  # ''), NOT OPENSEARCH_HOSTS — that one is the dashboards variable.
  OPENSEARCH_URL: http://opensearch:9200
  # The API refuses to start without a live Triton (no degraded mode), so
  # fake-triton answers liveness and readiness only: every inference call
  # stays unimplemented, which still proves no verified path needs Triton.
  TRITON_URL: fake-triton:8001
  # Serve byte-identical paths to what an existing labeler frontend
  # already calls, so it can be pointed at the harness without a
  # rebuild. Every curation router builds its prefix at module
  # import, so this must be set before src.main is imported.
  OP_API_PREFIX: /curation
  # Belt and braces: every project index (and the registry index)
  # carries the `verify_` prefix, and tests/live/conftest.py refuses
  # to run if any of them does not. `default` is bootstrapped as
  # verify_prj_default__<role>.
  OP_PROJECT_INDEX_PREFIX: verify_prj_
  # Writable, host-visible filesystem roots.
  OP_PROJECTS_DATA_ROOT: /verify-data/projects
  OP_SOURCE_ROOT: /verify-data/images
  OP_STATE_DIR: /verify-data/state
  OP_CROP_CACHE_DIR: /verify-data/crop_cache
  # Shared job-file protocol with the fake trainer.
  OP_TRAIN_JOBS_DIR: /jobs
  OP_SCORES_STATE_DIR: /jobs/scores
  OP_SELECT_JOBS_DIR: /jobs/select
  OP_VIZ_JOBS_DIR: /jobs/viz
  OP_AUTO_LABEL_STATE_DIR: /jobs/auto_label
  # OpenAI-compatible endpoint (src/services/labeling/vlm_client.py).
  OP_VLM_URL: http://fake-vlm:8000/v1
  OP_VLM_MODEL: fake-vlm
  OP_VLM_API_KEY: EMPTY
  # A configured secondary classifier is what makes `secondary_model` a
  # classifier class_source (the seeded cls* rows carry it); no model is
  # ever called.
  OP_INGEST_SECONDARY_DETECTOR_MODEL: seeded_classifier
  # Region routes 409 without an active region profile, and the text
  # routes need a text-bearing one.
  OP_REGION_PROFILE_PATH: /region_profile.json
  # This harness has no in-compose vLLM to switch (keeps the live
  # guard's local-model routes on their no_local_vlm path).
  OP_LOCAL_VLM_ENDPOINT: ''
  # Three write endpoints are disabled by default; without these the
  # harness would "exercise" them and only ever see 400.
  OP_SCORES_ENABLED: '1'
  OP_SELECT_DIVERSE_ENABLED: '1'
  OP_VIZ_PROJECTION_ENABLED: '1'
  HF_HOME: /tmp/hf
  HF_HUB_CACHE: /tmp/hf/hub

services:
  # Docker creates a missing bind-mount source as root:root, which the
  # non-root app user (uid 1000) then cannot write to (PermissionError on
  # /verify-data/projects). Create + chown it before anything uses it so
  # the harness works from a clean checkout with no manual `mkdir`.
  verify-data-init:
    image: ${VERIFY_CONTAINER_PREFIX:-op-verify}-api:latest
    build:
      context: ../..
      dockerfile: Dockerfile
      target: api
    user: root
    # The secrets are fixed throwaway values for this disposable stack, never a deployment's.
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /verify-data/jobs /verify-data/state /verify-data/source /verify-data/secrets/postgres /verify-data/secrets/valkey
        for n in super owner app; do printf 'verify-%s-password' "$$n" > /verify-data/secrets/postgres/$${n}_password; done
        printf 'verify-queue-password' > /verify-data/secrets/valkey/password
        printf 'requirepass verify-queue-password\n' > /verify-data/secrets/valkey/valkey.conf
        chmod 600 /verify-data/secrets/postgres/* /verify-data/secrets/valkey/*
        chown -R 1000:1000 /verify-data
    volumes:
      - ./verify-data:/verify-data
    restart: "no"
    networks:
      - verify_net

  postgres:
    image: postgres:18.6-trixie@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
    command: ["postgres", "-c", "max_connections=100", "-c", "password_encryption=scram-sha-256"]
    environment:
      - POSTGRES_USER=op_super
      - POSTGRES_DB=openprocessor
      - POSTGRES_PASSWORD_FILE=/run/secrets/op_pg/super_password
    volumes:
      - ./verify-data/secrets/postgres/super_password:/run/secrets/op_pg/super_password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U op_super -d openprocessor"]
      interval: 3s
      timeout: 5s
      retries: 40
    depends_on:
      verify-data-init:
        condition: service_completed_successfully
    networks:
      - verify_net

  valkey:
    image: valkey/valkey:9.1.3-alpine3.24@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    # The files are owned by uid 1000 (the init service), so run as that user; see docker-compose.yml.
    user: "1000:1000"
    command: ["valkey-server", "/run/secrets/op_valkey/valkey.conf", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - ./verify-data/secrets/valkey:/run/secrets/op_valkey:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/op_valkey/password)\" valkey-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 5s
      retries: 20
    depends_on:
      verify-data-init:
        condition: service_completed_successfully
    networks:
      - verify_net

  db-migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: api
    image: ${VERIFY_CONTAINER_PREFIX:-op-verify}-api:latest
    restart: "no"
    command: python -m scripts.db.migrate upgrade
    volumes:
      - ../../src:/app/src:ro
      - ../../scripts:/app/scripts:ro
      - ./verify-data/secrets/postgres:/run/secrets/op_pg:ro
    environment:
      - OP_DB_HOST=postgres
      - OP_DB_NAME=openprocessor
      - OP_DB_APP_PASSWORD_FILE=/run/secrets/op_pg/app_password
      - OP_DB_OWNER_PASSWORD_FILE=/run/secrets/op_pg/owner_password
      - OP_DB_SUPER_PASSWORD_FILE=/run/secrets/op_pg/super_password
      - OPENSEARCH_URL=http://opensearch:9200
      # Every project index carries the verify_ prefix, as for api.
      - OP_PROJECT_INDEX_PREFIX=verify_prj_
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - verify_net

  opensearch:
    image: opensearchproject/opensearch:3.6.0
    container_name: ${VERIFY_CONTAINER_PREFIX:-op-verify}-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      # Deliberately small: this is a throwaway fixture holding a few
      # hundred documents on a host that runs many other stacks.
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - ${VERIFY_OPENSEARCH_PORT:-14702}:9200
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:9200 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 40
    networks:
      - verify_net

  fake-triton:
    image: ${VERIFY_CONTAINER_PREFIX:-op-verify}-api:latest
    command: ["python", "-u", "/fake/fake_triton.py"]
    volumes:
      - ./fake_triton.py:/fake/fake_triton.py:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import tritonclient.grpc as g; assert g.InferenceServerClient('localhost:8001').is_server_live()"
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - verify_net

  fake-vlm:
    build:
      context: .
      dockerfile: Dockerfile.fake-vlm
    image: ${VERIFY_CONTAINER_PREFIX:-op-verify}-fake-vlm:latest
    container_name: ${VERIFY_CONTAINER_PREFIX:-op-verify}-fake-vlm
    environment:
      # Default class the fake answers with on the classification path.
      # Must match a class the seed script creates, so the label actually
      # resolves against the registry instead of landing in the
      # `vlm_unmatched` cohort.
      - FAKE_VLM_CLASS=box
      - FAKE_VLM_REGION_TEXT=FAKE-LABEL-0042
    ports:
      - ${VERIFY_FAKE_VLM_PORT:-14704}:8000
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - verify_net

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${VERIFY_CONTAINER_PREFIX:-op-verify}-api:latest
    container_name: ${VERIFY_CONTAINER_PREFIX:-op-verify}-api
    # NOTE: no `env_file: ./.env` — the harness is hermetic on purpose.
    volumes: &api-volumes
      - ../../src:/app/src:ro
      - ../../scripts:/app/scripts:ro
      - ../../VERSION:/app/VERSION:ro
      - ./region_profile.json:/region_profile.json:ro
      # Everything the API is allowed to write lives under one bind mount
      # so the test process can assert on the bytes it produced. The
      # previous ad-hoc harness mounted none of these and every registry
      # write / export vanished into the container layer.
      - ./verify-data:/verify-data
      - ./verify-data/jobs:/jobs
      - ./verify-data/secrets/postgres/app_password:/run/secrets/op_pg/app_password:ro
      - ./verify-data/secrets/valkey/password:/run/secrets/op_valkey/password:ro
    environment:
      <<: *process-env
      # Only the API sets this: it sizes the API pool (src/config/api_pools.py). The workers and
      # the Celery children do not, so a service that reaches the API pool there fails here too.
      WEB_CONCURRENCY: '1'
    command:
      - uvicorn
      - src.main:app
      - --host=0.0.0.0
      - --port=8000
      # ONE worker — see the header comment.
      - --workers=1
      - --log-level=info
    ports:
      - ${VERIFY_API_PORT:-14701}:8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/live || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
    depends_on:
      opensearch:
        condition: service_healthy
      fake-vlm:
        condition: service_healthy
      fake-triton:
        condition: service_healthy
      verify-data-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    networks:
      - verify_net

  # Celery workers and beat run the api image with the api's mounts and environment. Scale the
  # worker with `--scale jobs-worker=2`: no service here has a container_name.
  jobs-worker:
    image: ${VERIFY_CONTAINER_PREFIX:-op-verify}-api:latest
    volumes: *api-volumes
    environment: *process-env
    command: celery -A src.tasks.app worker -Q jobs --concurrency=2 --hostname jobs@%h -E
    depends_on: &worker-deps
      api:
        condition: service_healthy
    networks:
      - verify_net

  periodic-worker:
    image: ${VERIFY_CONTAINER_PREFIX:-op-verify}-api:latest
    volumes: *api-volumes
    environment: *process-env
    command: celery -A src.tasks.app worker -Q periodic -c 1 --hostname periodic@%h -E
    depends_on: *worker-deps
    networks:
      - verify_net

  jobs-beat:
    image: ${VERIFY_CONTAINER_PREFIX:-op-verify}-api:latest
    volumes: *api-volumes
    environment: *process-env
    command: celery -A src.tasks.app beat -s /tmp/celerybeat-schedule
    deploy:
      replicas: 1
    depends_on: *worker-deps
    networks:
      - verify_net

  # The auto-label loop runs here, not in the API: the same image, mounts and
  # environment as `api`, so it reads the same indexes, registry and job files.
  assist-loop-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${VERIFY_CONTAINER_PREFIX:-op-verify}-api:latest
    container_name: ${VERIFY_CONTAINER_PREFIX:-op-verify}-assist-loop-worker
    volumes: *api-volumes
    environment: *process-env
    command: ["python", "-m", "scripts.curation.assist_loop_worker"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "python /app/src/services/curation/worker_liveness.py check assist_loop_worker --max-age 120"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - verify_net

  trainer:
    # Reuses the API image (already built above) purely for bash + a
    # writable /jobs mount; it runs no application code.
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${VERIFY_CONTAINER_PREFIX:-op-verify}-api:latest
    container_name: ${VERIFY_CONTAINER_PREFIX:-op-verify}-trainer
    volumes:
      - ./fake_trainer.sh:/opt/fake_trainer.sh:ro
      - ./verify-data/jobs:/jobs
    environment:
      - FAKE_TRAINER_POLL_SECONDS=1
      - FAKE_TRAINER_EPOCHS=3
    command: ["bash", "/opt/fake_trainer.sh"]
    depends_on:
      verify-data-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f fake_trainer.sh > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - verify_net

networks:
  verify_net:
    driver: bridge
