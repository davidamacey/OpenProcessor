# Opt-in overlay: run the live harness against BUILT release images, with the
# source tree NOT mounted, so the suite tests what ships.
#
#   export OP_TEST_IMAGE_TAG=b4-9629e5c
#   export VERIFY_CONTAINER_PREFIX=op-live-built VERIFY_COMPOSE_PROJECT=op-live-built
#   docker compose -p op-live-built -f docker/test/compose.yml \
#     -f docker/test/compose.built.yml up -d --no-build --wait
#
# `!reset` drops the build blocks; `!override` replaces the volume lists, so the
# src/, scripts/ and VERSION bind mounts are gone (Compose cannot delete single
# list items). https://docs.docker.com/reference/compose-file/merge/
services:
  verify-data-init:
    image: op-local/api:${OP_TEST_IMAGE_TAG:?set OP_TEST_IMAGE_TAG}
    build: !reset null

  db-migrate:
    image: op-local/api:${OP_TEST_IMAGE_TAG:?set OP_TEST_IMAGE_TAG}
    build: !reset null
    volumes: !override
      - ./verify-data/secrets/postgres:/run/secrets/op_pg:ro

  fake-triton:
    image: op-local/api:${OP_TEST_IMAGE_TAG:?set OP_TEST_IMAGE_TAG}

  api:
    image: op-local/api:${OP_TEST_IMAGE_TAG:?set OP_TEST_IMAGE_TAG}
    build: !reset null
    volumes: !override
      - ./region_profile.json:/region_profile.json:ro
      - ./verify-data:/verify-data
      - ./verify-data/secrets/postgres/app_password:/run/secrets/op_pg/app_password:ro
      - ./verify-data/secrets/valkey/password:/run/secrets/op_valkey/password:ro

  jobs-worker:
    image: op-local/api:${OP_TEST_IMAGE_TAG:?set OP_TEST_IMAGE_TAG}
    volumes: !override
      - ./region_profile.json:/region_profile.json:ro
      - ./verify-data:/verify-data
      - ./verify-data/secrets/postgres/app_password:/run/secrets/op_pg/app_password:ro
      - ./verify-data/secrets/valkey/password:/run/secrets/op_valkey/password:ro

  interactive-worker:
    image: op-local/api:${OP_TEST_IMAGE_TAG:?set OP_TEST_IMAGE_TAG}
    volumes: !override
      - ./region_profile.json:/region_profile.json:ro
      - ./verify-data:/verify-data
      - ./verify-data/secrets/postgres/app_password:/run/secrets/op_pg/app_password:ro
      - ./verify-data/secrets/valkey/password:/run/secrets/op_valkey/password:ro

  periodic-worker:
    image: op-local/api:${OP_TEST_IMAGE_TAG:?set OP_TEST_IMAGE_TAG}
    volumes: !override
      - ./region_profile.json:/region_profile.json:ro
      - ./verify-data:/verify-data
      - ./verify-data/secrets/postgres/app_password:/run/secrets/op_pg/app_password:ro
      - ./verify-data/secrets/valkey/password:/run/secrets/op_valkey/password:ro

  jobs-beat:
    image: op-local/api:${OP_TEST_IMAGE_TAG:?set OP_TEST_IMAGE_TAG}
    volumes: !override
      - ./region_profile.json:/region_profile.json:ro
      - ./verify-data:/verify-data
      - ./verify-data/secrets/postgres/app_password:/run/secrets/op_pg/app_password:ro
      - ./verify-data/secrets/valkey/password:/run/secrets/op_valkey/password:ro

  assist-loop-worker:
    image: op-local/api:${OP_TEST_IMAGE_TAG:?set OP_TEST_IMAGE_TAG}
    volumes: !override
      - ./region_profile.json:/region_profile.json:ro
      - ./verify-data:/verify-data
      - ./verify-data/secrets/postgres/app_password:/run/secrets/op_pg/app_password:ro
      - ./verify-data/secrets/valkey/password:/run/secrets/op_valkey/password:ro

  cluster-worker:
    image: op-local/api:${OP_TEST_IMAGE_TAG:?set OP_TEST_IMAGE_TAG}
    volumes: !override
      - ./region_profile.json:/region_profile.json:ro
      - ./verify-data:/verify-data
      - ./verify-data/secrets/postgres/app_password:/run/secrets/op_pg/app_password:ro
      - ./verify-data/secrets/valkey/password:/run/secrets/op_valkey/password:ro

  arbiter-worker:
    image: op-local/api:${OP_TEST_IMAGE_TAG:?set OP_TEST_IMAGE_TAG}
    volumes: !override
      - ./region_profile.json:/region_profile.json:ro
      - ./verify-data:/verify-data
      - ./verify-data/secrets/postgres/app_password:/run/secrets/op_pg/app_password:ro
      - ./verify-data/secrets/valkey/password:/run/secrets/op_valkey/password:ro

  trainer:
    image: op-local/api:${OP_TEST_IMAGE_TAG:?set OP_TEST_IMAGE_TAG}
    volumes: !override
      - ./fake_trainer.py:/opt/fake_trainer/fake_trainer.py:ro
      - ./verify-data:/verify-data
      - ./verify-data/secrets/postgres/app_password:/run/secrets/op_pg/app_password:ro
      - ./verify-data/secrets/valkey/password:/run/secrets/op_valkey/password:ro

  open-vocab-worker:
    image: op-local/api:${OP_TEST_IMAGE_TAG:?set OP_TEST_IMAGE_TAG}
    volumes: !override
      - ./fake_consumers.py:/opt/fake_consumers/fake_consumers.py:ro
      - ./verify-data:/verify-data
      - ./verify-data/secrets/postgres/app_password:/run/secrets/op_pg/app_password:ro
      - ./verify-data/secrets/valkey/password:/run/secrets/op_valkey/password:ro

  autolabel-worker:
