version: 2
# Weekly, grouped: one PR per ecosystem instead of one per package.
# Every group declares `applies-to` twice. A group defaults to version-updates only,
# so without the `-security` twin each security advisory opens its own PR.
updates:
  # Backend Python: root requirements plus the side-car images and tools, one PR.
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/docker/trainer"
      - "/scripts/curation/bakeoff"
      - "/frontend/e2e"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Every runtime requirement is an exact pin (tests/test_requirements_contract.py rejects a
    # floor or a bare name), so each bump is a PR; widen a range only where a manifest keeps one.
    versioning-strategy: increase-if-necessary
    labels:
      - "dependencies"
    groups:
      backend:
        applies-to: version-updates
        patterns:
          - "*"
      backend-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # ultralytics is an exact pin everywhere (a test keeps requirements.txt,
      # requirements-test.txt and pyproject.toml equal). The export head changed inside 8.4.x
      # (#447), so every bump is by hand after the export checks.
      - dependency-name: "ultralytics"
      # tensorrt-cu13 must equal the TensorRT inside the Triton image (engine compatibility,
      # asserted at image build in Dockerfile.triton). Bump both together by hand.
      - dependency-name: "tensorrt-cu13"
      # nvidia-modelopt[onnx] 0.48 requires onnx~=1.21.0 on Linux, so every manifest
      # keeps onnx below 1.22. Lift the cap and this rule together when modelopt does.
      - dependency-name: "onnx"
        versions: [">=1.22.0"]
      # nvidia-modelopt 0.48 requires onnxruntime-gpu>=1.29,<1.31, so the cap stays below 1.31.
      # Lift the cap and this rule together when modelopt does.
      - dependency-name: "onnxruntime-gpu"
        versions: [">=1.31"]
      - dependency-name: "onnxruntime"
        versions: [">=1.31"]

  # Cropwright frontend: one PR.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      frontend:
        applies-to: version-updates
        patterns:
          - "*"
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # TypeScript 7 conflicts with svelte-check, typescript-eslint and @sveltejs/kit peer
      # ranges (all stop at 6.x); un-ignore once they ship TS 7 support.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  # Docusaurus site: one PR.
  - package-ecosystem: "npm"
    directory: "/docs-site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docs"
    groups:
      docs:
        applies-to: version-updates
        patterns:
          - "*"
      docs-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Docusaurus and its TypeScript tooling stop at TypeScript 6.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/benchmarks"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    groups:
      benchmarks-go:
        applies-to: version-updates
        patterns:
          - "*"
      benchmarks-go-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Dockerfile base images and pinned compose images, monthly, one PR per area.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/docker/segmenter"
      - "/docker/trainer"
      - "/docker/hardened/triton"
      - "/docker/test"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker:
        applies-to: version-updates
        patterns:
          - "*"
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Interpreter moves are owner decisions; digest-only updates for the same tag still arrive.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The Triton image carries TensorRT, which must equal tensorrt-cu13 (asserted in
      # Dockerfile.triton); move both together by hand, with an engine rebuild.
      - dependency-name: "nvcr.io/nvidia/tritonserver"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker"
    directories:
      - "/frontend"
      - "/docs-site"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    groups:
      web-docker:
        applies-to: version-updates
        patterns:
          - "*"
      web-docker-security:
        applies-to: security-updates
        patterns:
          - "*"
