version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      # requirements-export-y11.txt pins ultralytics==8.3.x on purpose: the vendored
      # EfficientNMS end2end patch breaks on 8.4. requirements.txt already carries the
      # 8.4 range for YOLO26. Dependabot cannot ignore per file, so bump the pin by hand.
      - dependency-name: "ultralytics"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  # Cropwright (frontend/): same grouping as the standalone project used, one npm PR a week.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 conflicts with svelte-check and @sveltejs/kit peer ranges (^5 || ^6);
      # un-ignore once svelte-check ships TS 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
      - "frontend"
