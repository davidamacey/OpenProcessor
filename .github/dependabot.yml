version: 2
# Weekly, grouped: one PR per ecosystem instead of one per package.
# Every group declares `applies-to` twice. A group defaults to version-updates only,
# so without the `-security` twin each security advisory opens its own PR.
updates:
  # Backend Python: root requirements plus the side-car images and tools, one PR.
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/docker/trainer"
      - "/scripts/curation/bakeoff"
      - "/frontend/e2e"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Most requirements here are ranges (>=X) that already resolve to the latest release at
    # build time, so raising the floor on every release only adds install risk. Widen a range
    # only when the latest release no longer satisfies it; exact pins (==) still get PRs.
    versioning-strategy: increase-if-necessary
    labels:
      - "dependencies"
    groups:
      backend:
        applies-to: version-updates
        patterns:
          - "*"
      backend-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # requirements-export-y11.txt pins ultralytics==8.3.x on purpose: the vendored
      # EfficientNMS end2end patch breaks on 8.4. requirements.txt already carries the
      # 8.4 range for YOLO26. Dependabot cannot ignore per file, so bump the pin by hand.
      - dependency-name: "ultralytics"
      # tensorrt-cu13 must equal the TensorRT inside the Triton image (engine compatibility,
      # asserted at image build in Dockerfile.triton). Bump both together by hand.
      - dependency-name: "tensorrt-cu13"
      # nvidia-modelopt[onnx] requires onnx~=1.21, so requirements.txt and the export
      # toolchain cap onnx below 1.22. Lift the cap and this rule together when modelopt does.
      - dependency-name: "onnx"
        versions: [">=1.22.0"]
      # tokenizers (a transformers dependency) requires huggingface-hub<2, so hub 2.x does not
      # resolve with the current stack (pip check fails). Lift once tokenizers allows 2.x.
      - dependency-name: "huggingface-hub"
        update-types: ["version-update:semver-major"]
      - dependency-name: "huggingface_hub"
        update-types: ["version-update:semver-major"]

  # Cropwright frontend: one PR.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      frontend:
        applies-to: version-updates
        patterns:
          - "*"
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # TypeScript 7 conflicts with svelte-check, typescript-eslint and @sveltejs/kit peer
      # ranges (all stop at 6.x); un-ignore once they ship TS 7 support.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  # Docusaurus site: one PR.
  - package-ecosystem: "npm"
    directory: "/docs-site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docs"
    groups:
      docs:
        applies-to: version-updates
        patterns:
          - "*"
      docs-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Docusaurus and its TypeScript tooling stop at TypeScript 6.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/benchmarks"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    groups:
      benchmarks-go:
        applies-to: version-updates
        patterns:
          - "*"
      benchmarks-go-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Dockerfile base images and pinned compose images, monthly, one PR per area.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/docker/evaluator"
      - "/docker/segmenter"
      - "/docker/trainer"
      - "/docker/hardened/triton"
      - "/docker/test"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker:
        applies-to: version-updates
        patterns:
          - "*"
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/frontend"
      - "/docs-site"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    groups:
      web-docker:
        applies-to: version-updates
        patterns:
          - "*"
      web-docker-security:
        applies-to: security-updates
        patterns:
          - "*"
