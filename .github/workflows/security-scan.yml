name: Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly rescan so newly published CVEs surface without a code change.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  fs-scan:
    name: Repo filesystem scan (deps + secrets + config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          # Same owner-accepted CVEs (with reasons) the release gate honours.
          trivyignores: scripts/release/trivy-allowlist.txt
          format: sarif
          output: trivy-fs.sarif
          # Without this, a SARIF run ignores `severity` and fails on MEDIUM/LOW findings.
          limit-severities-for-sarif: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif

  # Every published image is built and scanned, one image per job so a hosted runner's disk
  # fits it; the free-disk step reclaims ~30 GB of preinstalled toolchains first and each job's
  # image is removed after its scan. Sizes are in docs/image_size_audit.md.
  image-scan:
    name: Image scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            file: Dockerfile
            context: .
            target: api
          - image: export
            file: Dockerfile
            context: .
            target: export
          - image: evaluator
            file: Dockerfile
            context: .
            target: evaluator
          - image: trainer
            file: docker/trainer/Dockerfile
            context: .
            target: ''
          - image: segmenter
            file: docker/segmenter/Dockerfile
            context: docker/segmenter
            target: ''
          - image: cropwright
            file: frontend/Dockerfile
            context: frontend
            target: ''
          # ~32 GB: the Triton NGC base plus the TensorRT pin layer. Needs the free-disk step.
          - image: triton
            file: Dockerfile.triton
            context: .
            target: ''
    steps:
      - uses: actions/checkout@v7

      # Trivy finds CVEs in the OS and package layers, so an image is rebuilt and scanned only
      # when its base image (pinned in its Dockerfile) or its requirements change. The weekly
      # schedule and manual runs scan every image; the repo fs-scan above runs on every change.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          filters: |
            root: &root
              - 'Dockerfile'
              - 'requirements.txt'
              - 'requirements-export.txt'
              - 'requirements-export-y11.txt'
              - 'scripts/curation/bakeoff/requirements.txt'
            api: *root
            export: *root
            evaluator: *root
            trainer:
              - 'docker/trainer/Dockerfile'
              - 'docker/trainer/requirements.txt'
            segmenter:
              - 'docker/segmenter/Dockerfile'
            cropwright:
              - 'frontend/Dockerfile'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
            triton:
              - 'Dockerfile.triton'
              - 'docker/triton/**'

      - name: Decide whether this image needs a scan
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ steps.filter.outputs[matrix.image] }}
        run: |
          if [[ "$EVENT" != "pull_request" && "$EVENT" != "push" ]] || [[ "$CHANGED" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No input of the ${{ matrix.image }} image changed; skipping its build and scan."
          fi

      - name: Free disk space
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Build image
        if: steps.gate.outputs.run == 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: >
          docker build ${TARGET:+--target "$TARGET"}
          -t openprocessor-scan:${{ matrix.image }}
          -f ${{ matrix.file }} ${{ matrix.context }}

      # Trivy copies the image's layers to a temp dir before analysing them. On the root disk that
      # copy plus the build cache's intermediate stages ran out of space on the api image, so the
      # cache is dropped and the copy goes to the runner's separate /mnt disk (TMPDIR, honoured by
      # Go's os.TempDir).
      - name: Make room for the scan
        if: steps.gate.outputs.run == 'true'
        run: |
          docker builder prune --all --force
          sudo mkdir -p /mnt/trivy-tmp
          sudo chown "$USER" /mnt/trivy-tmp
          df -h / /mnt

      - name: Trivy image scan
        if: steps.gate.outputs.run == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TMPDIR: /mnt/trivy-tmp
        with:
          image-ref: openprocessor-scan:${{ matrix.image }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          # Same owner-accepted CVEs (with reasons) the release gate honours.
          trivyignores: scripts/release/trivy-allowlist.txt
          # Multi-GB images: the default 5m analysis deadline is far too short
          timeout: 30m
