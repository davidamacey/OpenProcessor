name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Sorts the change so docs-only PRs skip the hour-long suite and the weights job. Pattern from
  # the dorny/paths-filter README: with predicate-quantifier 'every', a file counts as code only
  # when it matches every pattern, so the '!' lines exclude docs.
  changes:
    name: Classify the change
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!docs-site/**'
              - '!**/*.md'
              - '!**/*.mdx'

  # Docs-only PRs: the tests that read docs (found by content, so a new one is picked up)
  # and the docs-vs-code check. A push to main still runs the full suite as the backstop.
  docs-tests:
    name: docs tests (docs-only change)
    needs: changes
    if: needs.changes.outputs.code != 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-test.txt

      - name: Install CPU torch/torchvision, then the rest of requirements-test.txt
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements-test.txt

      - name: Docs vs code (routes, OP_* variables, links)
        run: python scripts/docs/check_docs_vs_code.py

      - name: Tests that read docs
        run: |
          mapfile -t files < <(git grep -lE "\.mdx?['\"]|['\"]docs/|docs-site|README|CHANGELOG|CLAUDE\.md" \
            -- 'tests/*.py' ':!tests/live/*' ':!*conftest.py')
          echo "running ${#files[@]} test files"
          python -m pytest "${files[@]}" -q -n auto --no-cov -m 'not live and not families and not db'

  # The offline suite in 4 parallel shards (pytest-split, balanced by the committed
  # .test_durations file), each with pytest-xdist across the runner's cores. One job took
  # 77 minutes serial and 35 with xdist. Coverage is combined in `coverage` below and the
  # floor checked once on the whole suite.
  pytest:
    name: pytest (offline suite, shard ${{ matrix.group }}/4)
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    env:
      COVERAGE_FILE: .coverage.shard${{ matrix.group }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-test.txt

      - name: Install CPU torch/torchvision, then the rest of requirements-test.txt
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements-test.txt

      - name: Import sanity
        run: python -c "import src.main"

      - name: Run shard ${{ matrix.group }} of the offline suite
        run: >-
          python -m pytest tests/ -q -n auto -m 'not live and not families and not db'
          --splits 4 --group ${{ matrix.group }} --splitting-algorithm least_duration
          --cov=src --cov=scripts --cov-report=

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-shard${{ matrix.group }}
          path: .coverage.shard${{ matrix.group }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The `db` tier: tests that need a real PostgreSQL (tests/db, the `pg` fixture). The service
  # container is the image and digest of docker-compose.yml; the test fixture reads
  # OP_TEST_DATABASE_URL and needs the server superuser to be named op_super. Each xdist worker
  # migrates its own template database on that one server, so -n works. Service containers:
  # https://docs.github.com/en/actions/using-containerized-services/creating-postgresql-service-containers
  db:
    name: db tests (PostgreSQL service container)
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OP_TEST_DATABASE_URL: postgresql://op_super:op-test-super-password@localhost:5432/postgres
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
        env:
          POSTGRES_USER: op_super
          POSTGRES_PASSWORD: op-test-super-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U op_super"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-test.txt

      - name: Install CPU torch/torchvision, then the rest of requirements-test.txt
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements-test.txt

      - name: Run the db tier
        run: python -m pytest tests/ -q -n 2 -m db --no-cov

  # Line coverage of src/ and scripts/ measured 84.95 percent in the full local environment;
  # the floor sits below it because this runner installs fewer packages and so skips more
  # tests. Raise it to the measured value minus one whenever a change raises coverage.
  coverage:
    name: coverage floor (all shards)
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install coverage (the pin requirements-test.txt carries)
        run: pip install "$(grep -E '^coverage\[toml\]==' requirements-test.txt)"

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard*
          merge-multiple: true

      - name: Combine the shards and check the floor
        run: |
          coverage combine .coverage.shard*
          echo "total line coverage: $(coverage report --format=total)%"
          coverage report --fail-under=80 --format=total

  # Tests that need the official Ultralytics weights and the original-YOLOv5 ONNX exports
  # (pytest marker `families`, excluded from the `pytest` job). Runs the exact pinned
  # Ultralytics from requirements-test.txt on CPU. The weights and the ultralytics/yolov5
  # repository are AGPL-3.0; they are used for tests only and are not redistributed.
  # The original-YOLOv5 ONNX files come from that repository's own export.py in a separate
  # venv (it pins its own requirements), at a pinned commit.
  families:
    name: families (official weights, CPU)
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YOLOV5_COMMIT: 0a85386d269bf8b49873a24591491c1a4b7024a8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-test.txt

      - name: Install CPU torch/torchvision, then the rest of requirements-test.txt
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements-test.txt
          # export simplify=True needs it; the export image installs it from requirements-export.txt
          pip install "onnxslim>=0.1.71"

      - name: Cache the official weights and YOLOv5 ONNX exports
        id: weights-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/op-test-weights
          key: op-test-weights-${{ hashFiles('requirements-test.txt', 'tests/_ultralytics_weights.py') }}-${{ env.YOLOV5_COMMIT }}

      - name: Fetch the weights (sha256-checked)
        run: python tests/_ultralytics_weights.py fetch

      - name: Export the original YOLOv5 ONNX files (official export.py, separate venv)
        if: steps.weights-cache.outputs.cache-hit != 'true'
        run: |
          work="$RUNNER_TEMP/yolov5"
          git clone --filter=blob:none https://github.com/ultralytics/yolov5 "$work/src"
          git -C "$work/src" checkout "$YOLOV5_COMMIT"
          python -m venv "$work/venv"
          "$work/venv/bin/pip" install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          "$work/venv/bin/pip" install -r "$work/src/requirements.txt" onnx onnxslim
          cache="$HOME/.cache/op-test-weights"
          cp "$cache/yolov5n.pt" "$work/yolov5n.pt"
          "$work/venv/bin/python" "$work/src/export.py" --weights "$work/yolov5n.pt" \
            --include onnx --imgsz 640 --device cpu --simplify
          mv "$work/yolov5n.onnx" "$cache/yolov5n_640.onnx"
          "$work/venv/bin/python" "$work/src/export.py" --weights "$work/yolov5n.pt" \
            --include onnx --imgsz 640 --device cpu --dynamic
          mv "$work/yolov5n.onnx" "$cache/yolov5n_dynamic.onnx"

      - name: Run the families tests
        run: python -m pytest tests/ -q -m families --no-cov

  pre-commit:
    name: pre-commit (all hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-test.txt

      # pre-commit builds the gitleaks hook from source and newer setup-go majors set
      # GOTOOLCHAIN=local, so this Go must satisfy gitleaks' go.mod (1.22+). A newer Go
      # still builds benchmarks/ (its go.mod declares 1.21 as the minimum).
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache-dependency-path: benchmarks/go.mod

      - name: "Install golangci-lint (benchmarks/*.go hooks are `language: system`)"
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | \
            sh -s -- -b "$(go env GOPATH)/bin" v1.64.8
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: "Install hadolint (hadolint-docker hook is `language: system`)"
        run: |
          sudo curl -sSfL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # The api-contracts-drift hook imports the FastAPI app, so it needs the
      # same dependencies as the pytest job.
      - name: Install app dependencies (for the OpenAPI contract hook)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements-test.txt

      - name: Install pre-commit
        run: pip install pre-commit

      # Cold mypy over the whole tree takes minutes; the cache makes it seconds.
      - name: Cache mypy
        uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('requirements-test.txt', 'pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('requirements-test.txt', 'pyproject.toml') }}-

      - name: Run all hooks
        run: pre-commit run --all-files --show-diff-on-failure

  changelog:
    name: CHANGELOG entry for backend changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a CHANGELOG.md entry when src/, scripts/, docker/, export/ or models/ change
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="$BASE_SHA...$HEAD_SHA"
          elif git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            RANGE="$BEFORE_SHA...$AFTER_SHA"
          else
            # First push of a new branch, or before-SHA not reachable
            # (force-push, shallow history): nothing safe to diff against.
            echo "No usable base SHA to diff against; skipping."
            exit 0
          fi

          CHANGED="$(git diff --name-only $RANGE)"
          echo "Changed files:"
          echo "$CHANGED"

          # On pull_request, github.sha is the synthetic merge commit, never the author's
          # last commit; read the PR head instead.
          MSG_SHA="${HEAD_SHA:-$AFTER_SHA}"
          LAST_MSG="$(git log -1 --format=%B "$MSG_SHA")"
          if echo "$LAST_MSG" | grep -qF '[skip-changelog]'; then
            echo "Last commit message contains [skip-changelog]; skipping."
            exit 0
          fi

          if echo "$CHANGED" | grep -qE '^(src|scripts|docker|export|models)/' \
             && ! echo "$CHANGED" | grep -qx 'CHANGELOG.md'; then
            echo "::error::This push/PR changes src/, scripts/, docker/, export/ or models/ but does not update CHANGELOG.md. Add an entry under ## [Unreleased], or add [skip-changelog] to the last commit message if this truly has no user-facing or architectural effect."
            exit 1
          fi
