# images.lock -- key=image@sha256:digest for every image this
# release uses (installer plan section 3.1). CI-generated at tag time from
# the pushed digests (owner answer 11.1 #2: a local release script does
# this, no CI image builds -- see Wave 4).
#
# This committed copy is a development placeholder: every value is a
# syntactically valid but unresolvable placeholder digest so
# tests/installer/test_static.py can assert the *shape* (no ":latest", a
# digest is present) without requiring real pushed images. A real release
# overwrites this file entirely (scripts/release/build_deploy_bundle.sh
# refuses to bundle it otherwise).
#
# setup-openprocessor.sh refuses these placeholders (they are not 64-hex
# digests): a release installs only from a real lock. Before images are
# published, test with local-only tags instead:
#   setup-openprocessor.sh --release-dir <assets> --version vX.Y.Z --image-tag <tag>
# with OP_IMAGE_REPO=<local repo prefix>.
# Keys: scripts/lib/image_keys.sh (shared with the release script).
