# Pre-commit configuration for OpenProcessor
# Install: .venv/bin/pre-commit install   (hook types come from default_install_hook_types)
# Run manually: .venv/bin/pre-commit run --all-files

repos:
  # Standard pre-commit hooks (basic file checks)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(.*\.md|.*\.txt|src/static/docs/)
      - id: end-of-file-fixer
        exclude: ^(.*\.md|.*\.txt|src/static/docs/)
      - id: check-yaml
        args: [--unsafe]  # Allow custom YAML tags for docker-compose
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=10240]  # Allow model files up to 10MB
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  # Ruff: Fast Python linter and formatter (replaces black, isort, flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix, --show-fixes]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # Additional Python checks
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
      - id: python-no-eval
        # PyTorch model.eval() is safe; it is not the eval() builtin.
        exclude: ^(export/|docker/segmenter/sam3_backend\.py)
      - id: python-use-type-annotations

  # Every coded noqa says why. A bare `# noqa: CODE` is how a silenced rule is forgotten.
  - repo: local
    hooks:
      - id: noqa-needs-reason
        name: noqa carries a reason
        language: pygrep
        entry: '# noqa: ?[A-Z][A-Z0-9, ]*$'
        types: [python]
        files: ^(src|scripts|docker|export)/

  # Dockerfile linting with hadolint
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        name: Lint Dockerfiles
        files: Dockerfile.*
        entry: hadolint
        language: system

  # Secret detection with gitleaks
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: [--verbose, --no-banner]

  # Python security linting with bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(tests/|models/|frontend/)

  # Shell script linting with shellcheck
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  # Go linting with golangci-lint
  # Uses local hook since benchmark scripts are standalone with build tags
  # Requires: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'export PATH="$HOME/go/bin:$PATH" && cd benchmarks && for f in "$@"; do fname=$(basename "$f"); if [[ "$fname" == *"_batch"* ]]; then tag="batch"; else tag="single"; fi; golangci-lint run --build-tags "$tag" --config .golangci.yml "$fname" || exit 1; done' --
        language: system
        files: ^benchmarks/.*\.go$
        types: [go]
      - id: go-build
        name: go-build
        entry: bash -c 'cd benchmarks && for f in "$@"; do fname=$(basename "$f"); if [[ "$fname" == *"_batch"* ]]; then tag="batch"; else tag="single"; fi; go build -tags "$tag" -o /dev/null "$fname" || exit 1; done' --
        language: system
        files: ^benchmarks/.*\.go$
        types: [go]
      - id: max-file-size
        name: File size (warn 700, fail 1000 unless cohesive; CLAUDE.md 400)
        entry: python3 scripts/codegen/check_file_size.py
        language: system
        pass_filenames: false
        always_run: true
        # Scope, baseline and the warn band are in the script. Split an oversize file
        # by concern; do not collapse lines to fit.

      - id: check-layering
        name: Layering contract (routers > services > clients; fastapi only in routers)
        entry: python3 scripts/codegen/check_layering.py
        language: system
        pass_filenames: false
        files: ^(src|scripts)/.*\.py$

      # Both ratchets run ruff from the project interpreter, so they use the pinned version.
      - id: check-ruff-ratchet
        name: Complexity (per function) and broad-except (per file) ratchets
        entry: bash -c 'py=python3; [ -x .venv/bin/python ] && py=.venv/bin/python; exec "$py" scripts/codegen/check_ruff_ratchet.py'
        language: system
        pass_filenames: false
        files: ^(src|scripts|docker|export|models)/.*\.py$|^scripts/codegen/baselines/(complexity|broad_except)\.txt$

      - id: check-noqa-ratchet
        name: noqa comments per file may not grow
        entry: python3 scripts/codegen/check_noqa_ratchet.py
        language: system
        pass_filenames: false
        files: \.py$|^scripts/codegen/baselines/noqa\.txt$

      - id: check-process-ids
        name: No work-package ids or history names in comments, docstrings or file names
        entry: python3 scripts/codegen/check_process_ids.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-file-locks
        name: No file locks guard cross-process state (use a job lease)
        entry: python3 scripts/codegen/check_file_locks.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-process-state
        name: The API keeps no per-process state outside the reasoned baseline
        entry: python3 scripts/codegen/check_process_state.py
        language: system
        files: ^(src/.*\.py|scripts/codegen/check_process_state\.py|scripts/codegen/baselines/process_state\.txt)$
        pass_filenames: false

      - id: check-cited-paths
        name: Comments and docstrings cite files that exist
        entry: python3 scripts/codegen/check_cited_paths.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-vulture
        name: No new unused code (vulture)
        entry: bash -c 'py=python3; [ -x .venv/bin/python ] && py=.venv/bin/python; exec "$py" scripts/codegen/check_vulture.py'
        language: system
        pass_filenames: false
        files: ^(src|scripts|export|docker)/.*\.py$|^scripts/codegen/baselines/vulture\.txt$

      # mypy runs from the project interpreter so numpy, fastapi and pydantic types are
      # real (the isolated mirror hook saw none of them and passed vacuously). It falls
      # back to python3, where CI has the dependencies installed. Targets and the
      # pydantic plugin are in [tool.mypy] in pyproject.toml.
      - id: mypy
        name: mypy
        entry: bash -c 'py=python3; [ -x .venv/bin/python ] && py=.venv/bin/python; exec "$py" -m mypy'
        language: system
        pass_filenames: false
        files: ^(src|scripts|docker|export|tests)/.*\.py$|^(pyproject\.toml|requirements-test\.txt)$

      - id: check-mypy-tests
        name: The list of test modules mypy still skips only shrinks
        entry: python3 scripts/codegen/check_mypy_tests.py
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|scripts/codegen/check_mypy_tests\.py|scripts/codegen/baselines/mypy_tests\.txt|tests/.*\.py)$

      # Lean frontend gate: only the staged frontend files, through the app's own
      # node_modules (npm ci in frontend/). svelte-check (~30 s) runs at pre-push and
      # vitest stays in CI and the lane checks, both too slow for a commit hook. A missing
      # node_modules fails the hook instead of passing vacuously.
      - id: frontend-prettier
        name: frontend prettier --check (staged files)
        entry: bash -c 'cd frontend && exec node_modules/.bin/prettier --check --ignore-unknown "${@#frontend/}"' --
        language: system
        files: ^frontend/
      # --cache with the content strategy (https://eslint.org/docs/latest/use/command-line-interface#--cache):
      # an unchanged file under an unchanged config is not linted again. The cache sits in the
      # checkout's own gitignored .cache/, in a directory named by the lockfile hash, so a
      # dependency or plugin bump starts a fresh one and no worktree reads another's. The config
      # is the base (not type-aware) one: ESLint's cache does not track dependencies between
      # files, which only rules that read other files (type-aware, import resolution) need.
      - id: frontend-eslint
        name: frontend eslint (staged files)
        entry: bash -c 'cd frontend && h=$(sha256sum package-lock.json | cut -c1-16) && exec node_modules/.bin/eslint --no-warn-ignored --cache --cache-strategy content --cache-location ".cache/eslint/$h/" "${@#frontend/}"' --
        language: system
        files: ^frontend/.*\.(js|ts|svelte)$
      # knip is whole-project (a file is unused only relative to every entry point), so
      # it takes no filenames and runs whenever frontend source, config or deps change.
      # `svelte-kit sync` first: it writes node_modules/$app/tsconfig.json, which
      # tsconfig.json extends and vite.config.ts needs; without it knip cannot load the
      # vite config, loses the $lib/$components/$stores aliases and reports every
      # aliased import as unresolved and its target file as unused
      # (https://knip.dev/reference/known-issues, "Error loading vite.config.ts").
      - id: frontend-knip
        name: frontend knip (unused files, exports, dependencies)
        entry: bash -c 'cd frontend && node_modules/.bin/svelte-kit sync && exec node_modules/.bin/knip'
        language: system
        pass_filenames: false
        files: ^frontend/(src|scripts|static)/|^frontend/(knip\.json|package(-lock)?\.json|svelte\.config\.js|sveltekit\.options\.js|vite\.config\.ts|tsconfig\.json)$

      # Frontend twin of the Python complexity ratchet. Scans only the staged files (~2 s)
      # and checks only their baseline entries; the config adds ESLint's `complexity` (15).
      - id: check-frontend-complexity
        name: Frontend per-function complexity ratchet (staged files)
        entry: python3 scripts/codegen/check_frontend_complexity.py
        language: system
        files: ^frontend/src/.*\.(js|ts|svelte)$

      # jscpd clone detector over src, scripts and frontend/src (~1.5 s). Whole-project
      # because a clone is a pair of files, so it takes no filenames.
      - id: check-duplication
        name: No new duplicated code (jscpd ratchet)
        entry: python3 scripts/codegen/check_duplication.py
        language: system
        pass_filenames: false
        files: ^(src|scripts)/.*\.py$|^frontend/(src/.*\.(js|ts|svelte)|eslint\.complexity\.config\.js|package(-lock)?\.json)$|^scripts/codegen/check_duplication\.py$|^scripts/codegen/baselines/duplication\.txt$

      # Whole-project type check, too slow (~30 s) for every commit: runs on git push.
      - id: frontend-svelte-check
        name: frontend svelte-check (0 errors)
        entry: bash -c 'cd frontend && node_modules/.bin/svelte-kit sync && exec node_modules/.bin/svelte-check --tsconfig ./tsconfig.json --threshold error'
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^frontend/(src|static)/|^frontend/(package(-lock)?\.json|svelte\.config\.js|sveltekit\.options\.js|vite\.config\.ts|tsconfig\.json)$

      # Standards that live in tests rather than scripts (config paths exist, no
      # single-box region scalars, no request fan-out, the guards' own tests). ~1 min,
      # so pre-push; the docs-vs-code check (routes, OP_* vars, links) is ~1.5 min and
      # runs here for the same reason.
      - id: standards-guard-tests
        name: Standards guard tests (tooling config, region scalars, fan-out, codegen)
        entry: bash -c 'py=python3; [ -x .venv/bin/python ] && py=.venv/bin/python; exec "$py" -m pytest tests/codegen tests/test_tooling_config.py tests/test_no_legacy_region_scalars.py tests/test_no_request_fan_out.py -q --no-cov -n 4 -p no:cacheprovider'
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(src|scripts|tests)/.*\.py$|^(\.pre-commit-config\.yaml|pyproject\.toml)$
      - id: docs-vs-code
        name: Docs name only routes, OP_* variables and links that exist
        entry: bash -c 'py=python3; [ -x .venv/bin/python ] && py=.venv/bin/python; exec "$py" scripts/docs/check_docs_vs_code.py'
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: \.md$|^contracts/|^env\.template$|^docker-compose.*\.yml$

      - id: check-naming-leaks
        name: Ban private-company and domain-vendor naming leaks (naming sweep)
        entry: python3 scripts/codegen/check_naming_leaks.py
        language: system
        pass_filenames: false
        always_run: true
        # Scans the whole tracked tree (not just changed files) for the
        # company/product name, retired vendor-model vocabulary, and the
        # private class-registry vocabulary (see the checker script's
        # module docstring for the exact patterns). Allowlist of
        # deliberate, reviewed exceptions lives in
        # scripts/codegen/naming_leak_allowlist.txt.

      - id: region-status-ts-drift
        name: RegionStatus TypeScript contract is in sync
        entry: python3 scripts/codegen/export_region_status_to_ts.py --check
        language: system
        pass_filenames: false
        files: ^(src/config/region_state\.py|contracts/ts/regionStatus\.ts|scripts/codegen/export_region_status_to_ts\.py)$

      # Imports the app (~10s), so it re-runs itself under the project venv
      # with a scrubbed env; it only fires when Python source or its own
      # outputs change. Regenerate with `make contracts`.
      - id: api-contracts-drift
        name: Item wire / class-source / curation OpenAPI contracts are in sync
        # Imports the app (src.main), so it needs the project's dependencies: prefer the
        # venv the repo tells you to use, and fall back to python3 where CI has them installed.
        entry: bash -c 'py=python3; [ -x .venv/bin/python ] && py=.venv/bin/python; exec "$py" scripts/codegen/export_api_contracts.py --check'
        language: system
        pass_filenames: false
        files: ^(src/.*\.py|contracts/json/item_wire\.json|contracts/openapi/curation\.json|contracts/ts/(itemWire|classSources)\.ts|scripts/codegen/(export_api_contracts|_contract_runtime)\.py)$

  # Commit message linting (conventional commits). Scope stays optional.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert, security]

# Global configuration
default_language_version:
  python: python3.12

# `pre-commit install` installs all three hook types.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
fail_fast: false

# Files to exclude
exclude: |
  (?x)^(
      \.venv/|
      __pycache__/|
      \.pytest_cache/|
      \.mypy_cache/|
      \.ruff_cache/|
      pytorch_models/|
      models/.*\.(plan|onnx|engine|bin|pt)$|
      cache/|
      benchmarks/results/|
      .*\.egg-info/
  )
