# Grafana Unified Alerting Configuration
# This file configures Grafana's native alerting system with:
# - Alert rules for the API, Triton, GPU and host metrics
# - Contact points for notifications
# - Notification policies for routing
#
# Every metric a rule reads must be one the stack exports:
# tests/test_monitoring_metric_names.py checks them against
# monitoring/exported_metrics.txt. Per-model readiness and OpenSearch cluster status are
# not exported by anything here, so there is no rule for them (see monitoring/README.md).
#
# NOTIFICATIONS ARE OFF UNTIL YOU CONFIGURE A CONTACT POINT. The two contact points
# below are named "unconfigured-*" on purpose: they post to a localhost address nothing
# listens on, so a firing alert shows in Grafana (Alerting > Alert rules, and the
# dashboards' firing-alerts panel) and its delivery fails with a logged error; nobody is
# told. Replace the receivers (a real webhook URL, Slack or email, examples below) and
# restart Grafana; the file is provisioned read-only, so edit it here, not in the UI.

apiVersion: 1

# =============================================================================
# Contact Points - Where alerts are sent
# =============================================================================
contactPoints:
  # Default (warning) alerts. Replace the receiver to notify anyone.
  - orgId: 1
    name: unconfigured-default
    receivers:
      - uid: webhook-default
        type: webhook
        settings:
          # Placeholder: nothing listens here. Set a real webhook URL (Discord, a
          # script, an incident tool).
          url: "http://localhost:9999/alerts"
          httpMethod: POST
        disableResolveMessage: false

      # Slack: set SLACK_WEBHOOK_URL in the Grafana container's environment (for example
      # in a docker-compose.override.yml) and uncomment.
      # - uid: slack-alerts
      #   type: slack
      #   settings:
      #     url: "${SLACK_WEBHOOK_URL}"
      #     recipient: "#alerts"
      #     mentionChannel: here
      #     text: |
      #       {{ range .Alerts }}
      #       *{{ .Status | toUpper }}* - {{ .Labels.alertname }}
      #       {{ .Annotations.summary }}
      #       {{ end }}

      # Email needs an SMTP server configured for Grafana (GF_SMTP_* variables).
      # - uid: email-alerts
      #   type: email
      #   settings:
      #     addresses: "ops@example.com"
      #     singleEmail: true

  # Critical alerts (faster repeat). Replace the receiver the same way.
  - orgId: 1
    name: unconfigured-critical
    receivers:
      - uid: webhook-critical
        type: webhook
        settings:
          url: "http://localhost:9999/alerts/critical"
          httpMethod: POST
        disableResolveMessage: false

# =============================================================================
# Notification Policies - How alerts are routed
# =============================================================================
policies:
  - orgId: 1
    receiver: unconfigured-default
    group_by:
      - alertname
      - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # Critical alerts go to critical channel with faster notification
      - receiver: unconfigured-critical
        matchers:
          - severity = critical
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 1h
        continue: false

# =============================================================================
# Alert Rules
# =============================================================================
groups:
  # -------------------------------------------------------------------------
  # API Service Health Alerts
  # -------------------------------------------------------------------------
  - orgId: 1
    name: API Service Health
    folder: OpenProcessor Alerts
    interval: 30s
    rules:
      # API High Error Rate
      - uid: api-high-error-rate
        title: API High Error Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                sum(rate(http_request_duration_seconds_count{status=~"5.."}[5m])) /
                sum(rate(http_request_duration_seconds_count[5m])) * 100
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [5]
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              type: classic_conditions
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 2m
        annotations:
          summary: "High API error rate detected"
          description: "API error rate is above 5% - check logs for details"
        labels:
          severity: warning
          component: api

      # API Slow Response Time
      - uid: api-slow-response
        title: API Slow Response Time
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                histogram_quantile(0.95,
                  rate(http_request_duration_seconds_bucket[5m])) * 1000
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [500]
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              type: classic_conditions
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 2m
        annotations:
          summary: "API p95 response time is high"
          description: "API p95 latency is above 500ms"
        labels:
          severity: warning
          component: api

  # -------------------------------------------------------------------------
  # Triton Inference Server Alerts
  # -------------------------------------------------------------------------
  - orgId: 1
    name: Triton Inference Server
    folder: OpenProcessor Alerts
    interval: 30s
    rules:
      # Triton Server Down
      - uid: triton-server-down
        title: Triton Server Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="triton"}
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              type: classic_conditions
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        annotations:
          summary: "Triton Inference Server is DOWN"
          description: "Triton server is not responding - all inference will fail"
        labels:
          severity: critical
          component: triton

      # High Inference Latency
      - uid: triton-high-latency
        title: Triton High Inference Latency
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                (rate(nv_inference_compute_infer_duration_us[5m]) /
                 rate(nv_inference_request_success[5m])) / 1000
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [100]
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: avg
              type: classic_conditions
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 2m
        annotations:
          summary: "High inference latency on {{ $labels.model }}"
          description: "Average inference latency is above 100ms"
        labels:
          severity: warning
          component: triton

      # High Request Queue
      - uid: triton-high-queue
        title: Triton High Request Queue
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(nv_inference_pending_request_count)
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [50]
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              type: classic_conditions
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 2m
        annotations:
          summary: "High inference request queue"
          description: "More than 50 requests pending - consider scaling"
        labels:
          severity: warning
          component: triton

  # -------------------------------------------------------------------------
  # GPU Resource Alerts
  # -------------------------------------------------------------------------
  - orgId: 1
    name: GPU Resources
    folder: OpenProcessor Alerts
    interval: 30s
    rules:
      # High GPU Utilization
      - uid: gpu-high-utilization
        title: High GPU Utilization
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: nv_gpu_utilization * 100
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [95]
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: avg
              type: classic_conditions
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: "High GPU utilization on {{ $labels.gpu_uuid }}"
          description: "GPU utilization above 95% for 5+ minutes"
        labels:
          severity: warning
          component: gpu

      # High GPU Memory
      - uid: gpu-high-memory
        title: High GPU Memory Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                (nv_gpu_memory_used_bytes / nv_gpu_memory_total_bytes) * 100
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [90]
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: avg
              type: classic_conditions
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: "High GPU memory usage on {{ $labels.gpu_uuid }}"
          description: "GPU memory usage above 90%"
        labels:
          severity: warning
          component: gpu

      # GPU Temperature Warning
      - uid: gpu-high-temperature
        title: High GPU Temperature
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: DCGM_FI_DEV_GPU_TEMP
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [80]
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: max
              type: classic_conditions
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 2m
        annotations:
          summary: "High GPU temperature on GPU {{ $labels.gpu }}"
          description: "GPU temperature (DCGM, needs the monitoring profile) above 80°C - check cooling"
        labels:
          severity: warning
          component: gpu

  # -------------------------------------------------------------------------
  # System Resource Alerts
  # -------------------------------------------------------------------------
  - orgId: 1
    name: System Resources
    folder: OpenProcessor Alerts
    interval: 30s
    rules:
      # High System Memory
      - uid: system-high-memory
        title: High System Memory Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [90]
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: avg
              type: classic_conditions
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: "High system memory usage"
          description: "System memory usage above 90%"
        labels:
          severity: warning
          component: system

      # High CPU Usage
      - uid: system-high-cpu
        title: High System CPU Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) * 100
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [90]
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: avg
              type: classic_conditions
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: "High system CPU usage"
          description: "System CPU usage above 90% for 5+ minutes"
        labels:
          severity: warning
          component: system

      # High Load Average
      - uid: system-high-load
        title: High System Load Average
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                node_load5 / count(count(node_cpu_seconds_total{mode="idle"}) by (cpu))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [2]
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: avg
              type: classic_conditions
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: "High system load average"
          description: "Load average per CPU is above 2.0"
        labels:
          severity: warning
          component: system
