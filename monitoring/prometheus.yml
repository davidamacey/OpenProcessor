global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Load alert rules
rule_files:
  - '/etc/prometheus/alerts/*.yml'

scrape_configs:
  - job_name: 'triton'
    static_configs:
      - targets: ['triton-server:8002']
        labels:
          group: 'triton_inference_server'

  - job_name: 'api'
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8000']
        labels:
          group: 'api'

  # Background workers (compose profile `curation`). Each serves its own
  # registry; a target is down whenever that worker is not running.
  - job_name: 'curation-detection-worker'
    static_configs:
      - targets: ['curation-detection-worker:4609']
        labels:
          group: 'worker'

  - job_name: 'curation-vlm-worker'
    static_configs:
      - targets: ['curation-vlm-worker:4610']
        labels:
          group: 'worker'

  - job_name: 'curation-auto-label-worker'
    static_configs:
      - targets: ['curation-auto-label-worker:4611']
        labels:
          group: 'worker'

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          group: 'system'

  - job_name: 'dcgm'
    static_configs:
      - targets: ['dcgm-exporter:9400']
        labels:
          group: 'gpu'

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
