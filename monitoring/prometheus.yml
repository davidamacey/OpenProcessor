global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Load alert rules
rule_files:
  - '/etc/prometheus/alerts/*.yml'

# Scaled services (`docker compose up --scale api=3`) are scraped with dns_sd_configs, type A:
# Docker's embedded DNS answers the service name with every replica's address, so each replica is
# its own target. https://prometheus.io/docs/prometheus/latest/configuration/configuration/#dns_sd_config
# A replica's `instance` is a container IP that changes when the container is recreated, so the
# `service` label (the compose service name, set below from the DNS name) is the stable key:
# dashboards and alerts aggregate by `service` or `job`, never by `instance` or `container`.
scrape_configs:
  - job_name: 'triton'
    dns_sd_configs:
      - names: ['triton-server']
        type: A
        port: 8002
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service

  # The frame engine (GPU decode and prep): op_frame_engine_stage_* and its overload,
  # region and outcome counters. One target per engine replica.
  - job_name: 'frame-engine'
    dns_sd_configs:
      - names: ['frame-engine']
        type: A
        port: 8002
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service

  # The Python API (the service api-py, port 4613, not published): http_request_duration_seconds of
  # every request it answers, which is every request the Rust front forwards.
  - job_name: 'api'
    metrics_path: /metrics
    dns_sd_configs:
      - names: ['api-py']
        type: A
        port: 4613
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service

  # The Rust front (the service api, port 8000): the routes it answers itself and what it counts
  # about forwarding (op_api_forward_failures_total, op_api_requests_shed_total). Its registry is
  # on /metrics/front: on the API port /metrics is the Python API's and is forwarded to it. A
  # request is observed by the process that answers it, so the two jobs never count one request
  # twice.
  - job_name: 'api-front'
    metrics_path: /metrics/front
    dns_sd_configs:
      - names: ['api']
        type: A
        port: 8000
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service

  # Background workers (compose profile `curation`). Each serves its own
  # registry; a target is down whenever that worker is not running.
  - job_name: 'curation-detection-worker'
    static_configs:
      - targets: ['curation-detection-worker:4609']
        labels:
          group: 'worker'
          service: 'curation-detection-worker'

  - job_name: 'curation-vlm-worker'
    static_configs:
      - targets: ['curation-vlm-worker:4610']
        labels:
          group: 'worker'
          service: 'curation-vlm-worker'

  - job_name: 'curation-auto-label-worker'
    static_configs:
      - targets: ['curation-auto-label-worker:4611']
        labels:
          group: 'worker'
          service: 'curation-auto-label-worker'

  # Celery workers: each container serves its merged multiprocess registry on
  # OP_WORKER_METRICS_PORT (src/tasks/worker_metrics.py); one A-record target per replica.
  - job_name: 'celery-workers'
    dns_sd_configs:
      - names:
          - jobs-worker
          - interactive-worker
          - periodic-worker
          - open-vocab-worker
          - cluster-worker
          - curation-auto-label-worker
          - curation-assist-loop-worker
        type: A
        port: 9808
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service

  - job_name: 'valkey'
    static_configs:
      - targets: ['valkey-exporter:9121']
        labels:
          group: 'queue'
          service: 'valkey'

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          group: 'system'

  - job_name: 'dcgm'
    static_configs:
      - targets: ['dcgm-exporter:9400']
        labels:
          group: 'gpu'

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
