# G-01: no fixed project name. Compose falls back to `openprocessor`
# (via COMPOSE_PROJECT_NAME's default below) only when neither -p nor
# COMPOSE_PROJECT_NAME nor .env's COMPOSE_PROJECT_NAME is set, which
# keeps an existing single-stack user's behavior unchanged. A second
# isolated stack on the same host sets COMPOSE_PROJECT_NAME (or -p) to
# get its own project name, container names, network and volumes.
name: ${COMPOSE_PROJECT_NAME:-openprocessor}

services:
  triton-server:
    image: davidamacey/openprocessor-triton:latest
    build:
      context: .
      dockerfile: Dockerfile.triton
    container_name: ${COMPOSE_PROJECT_NAME:-openprocessor}-triton
    restart: always
    ports:
      - "${TRITON_HTTP_PORT:-4600}:8000"  # HTTP
      - "${TRITON_GRPC_PORT:-4601}:8001"  # gRPC
      - "${TRITON_METRICS_PORT:-4602}:8002"  # Metrics
    volumes:
      - ./models:/models
    command:
      - tritonserver
      - --model-store=/models
      - --backend-config=default-max-batch-size=128
      - --strict-model-config=false
      - --model-control-mode=explicit
      # ===================================================================
      # Visual Search Models
      # ===================================================================
      - --load-model=yolov11_small_trt_end2end
      - --load-model=scrfd_10g_bnkps
      - --load-model=arcface_w600k_r50
      - --load-model=mobileclip2_s2_image_encoder
      - --load-model=mobileclip2_s2_text_encoder
      - --load-model=paddleocr_det_trt
      - --load-model=paddleocr_rec_trt
      - --load-model=ocr_pipeline
      # G-07: pe_image_encoder backs curation semantic search and the
      # near-dup/uniqueness item scorers -- CURATION.md calls it required,
      # not optional, so it belongs in the default load list.
      - --load-model=pe_image_encoder
      # ===================================================================
      - --log-verbose=1
      - --log-info=true
    shm_size: 8g
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '0' ]
              capabilities:
                - gpu
    networks:
      - triton_net

  yolo-api:
    image: davidamacey/openprocessor:latest
    container_name: ${COMPOSE_PROJECT_NAME:-openprocessor}-api
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OP_BUILD_SHA: "${OP_BUILD_SHA:-}"
    # CFG-5: previously the ONLY var reaching this container from .env was
    # OP_API_PREFIX (explicitly interpolated below) -- everything else in
    # .env (see env.template) was silently unreachable. env_file loads the
    # whole file as container env vars; explicit `environment:` entries
    # below still take precedence over same-named .env values.
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./src:/app/src
      - ./export:/app/export
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./benchmarks:/app/benchmarks
      - ./models:/app/models
      - ./pytorch_models:/app/pytorch_models
      - ./test_images:/app/test_images
      - ./VERSION:/app/VERSION:ro
      - ./data:/app/data
      - openprocessor-state:/var/lib/openprocessor
      # Shared with the curation-auto-label-worker service (profile
      # `curation`): the API writes /jobs/auto_label/trigger.json and
      # polls state.json/heartbeat; the worker claims and runs it. Also
      # backs OP_TRAIN_JOBS_DIR / OP_SCORES_STATE_DIR / OP_SELECT_JOBS_DIR
      # / OP_VIZ_JOBS_DIR / OP_PROBE_JOBS_DIR / OP_REGION_DRAIN_STATE_DIR
      # (all default under /jobs — see env.template). This same shared
      # mount is what makes state.json/heartbeat/cancel.flag visible to
      # every yolo-api --workers process, not just whichever one handled
      # a given request.
      - openprocessor-jobs:/jobs
      - ./cache/huggingface:/home/appuser/.cache/huggingface  # HuggingFace tokenizers (appuser)
      # ST-1: shared tmpfs item-crop cache with curation-detection-worker.
      # curation-vlm-worker doesn't need it -- it reads crops through the
      # API's /vlm/label_batch.
      - openprocessor-crop-cache:/var/cache/openprocessor/crops
      # G-06: source image root for curation ingest (OP_SOURCE_ROOT below).
      # Must be mounted at the SAME container path in curation-detection-worker
      # -- the worker resolves item paths against the same root the API used
      # at ingest time. See docs/CURATION.md "Mounting your image source".
      - ${OP_SOURCE_ROOT_HOST:-./data/source}:/data/source:ro
      # G-08: worked-example region profiles / bake-off baselines
      # (OP_REGION_PROFILE_PATH=/app/examples/region_profiles/license_plate.json).
      - ./examples:/app/examples:ro
    environment:
      # Triton gRPC endpoint (Docker service name)
      - TRITON_URL=triton-server:8001
      # HuggingFace cache configuration (appuser home directory)
      - HF_HOME=/home/appuser/.cache/huggingface
      - HF_HUB_CACHE=/home/appuser/.cache/huggingface/hub
      - OP_CROP_CACHE_DIR=/var/cache/openprocessor/crops
      # Curation/labeling API prefix (CurationConfig.api_prefix, generic
      # default /curation — see env.template). Every curation router
      # builds its prefix at *module import*, so this must be set before
      # src.main is imported; it cannot change at container runtime.
      - OP_API_PREFIX=${OP_API_PREFIX:-/curation}
      # G-06: in-container path the API resolves source-relative item
      # paths against. Must match the bind target above.
      - OP_SOURCE_ROOT=${OP_SOURCE_ROOT:-/data/source}
    # G-10: on Linux, host.docker.internal only resolves with this mapping
    # (Docker Desktop adds it automatically; the Linux engine does not).
    # Needed for the "point OP_VLM_URL at a VLM running on the host" example
    # in docs/CURATION.md.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: 8g
    stdin_open: true # Keep stdin open
    tty: true # Allocate a pseudo-TTY
    command:
      - uvicorn
      - src.main:app
      - --host=0.0.0.0
      - --port=8000
      # ===================================================================
      # Worker Configuration (Performance Tuning)
      # Production: 64 workers for dual-GPU throughput
      # Benchmark: 4 workers to match TRT instance count for fair comparison
      # ===================================================================
      - --workers=32  # Increased for higher face pipeline throughput
      - --limit-max-requests=10000       # Recycle workers every 10k requests (prevents memory leaks)
      # ===================================================================
      # Event Loop & HTTP Protocol (Already Optimized)
      # ===================================================================
      - --loop=uvloop                    # 2-3x faster than asyncio default loop
      - --http=httptools                 # Faster HTTP parsing than h11
      # ===================================================================
      # Connection & Concurrency Settings
      # ===================================================================
      - --backlog=4096                   # Socket connection queue size
      - --limit-concurrency=512          # Max concurrent requests (prevents overload)
      - --timeout-keep-alive=75          # Keep connections alive for reuse
      - --timeout-graceful-shutdown=30   # Clean shutdown (drain connections)
      # ===================================================================
      # Logging
      # ===================================================================
      - --access-log
      - --log-level=info
    ports:
      - "${API_PORT:-4603}:8000"  # FastAPI
    ulimits:
      memlock: -1
      stack: 67108864
    healthcheck:
      # S-7: curation workers gate startup on `condition: service_healthy`
      # against this service; without a healthcheck here that condition
      # can never resolve.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '0' ]
              capabilities:
                - gpu
    depends_on:
      - triton-server
    networks:
      # G-28: Cropwright's default API_UPSTREAM is http://op-api:8000. The
      # public compose's service is named yolo-api; this alias lets
      # Cropwright's out-of-the-box default resolve without every deployer
      # having to override API_UPSTREAM. See docs/CURATION.md "Wiring up
      # Cropwright".
      triton_net:
        aliases:
          - op-api

  # ===================================================================
  # Curation subsystem — EXPERIMENTAL, opt-in via `--profile curation`
  # (D7). `docker compose up -d` on its own never starts anything below
  # this point; run `docker compose --profile curation up -d` (or
  # `make curation-up`) once you also want the async labeling/detection
  # workers. See docs/design/curation_design_rationale.md.
  #
  # Every worker below mounts ./src and ./scripts read-only (:ro) —
  # unlike yolo-api's writable hot-reload mounts, these are long-running
  # background processes with no request/response cycle to redeploy
  # against; a `docker compose --profile curation up -d --force-recreate
  # <service>` picks up code changes.
  # ===================================================================

  curation-detection-worker:
    image: davidamacey/openprocessor:latest
    container_name: ${COMPOSE_PROJECT_NAME:-openprocessor}-detection-worker
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OP_BUILD_SHA: "${OP_BUILD_SHA:-}"
    profiles:
      - curation
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - openprocessor-state:/var/lib/openprocessor
      # ST-1: shared with yolo-api -- see that service's mount comment.
      - openprocessor-crop-cache:/var/cache/openprocessor/crops
      # G-06: same source root, same container path, as yolo-api -- the
      # worker resolves item source paths written at ingest time against
      # this mount. See docs/CURATION.md "Mounting your image source".
      - ${OP_SOURCE_ROOT_HOST:-./data/source}:/data/source:ro
      # G-08: region profile examples (OP_REGION_PROFILE_PATH).
      - ./examples:/app/examples:ro
    environment:
      - TRITON_URL=triton-server:8001
      - OPENSEARCH_URL=http://opensearch:9200
      - OP_CROP_CACHE_DIR=/var/cache/openprocessor/crops
      - OP_SOURCE_ROOT=${OP_SOURCE_ROOT:-/data/source}
      # D5: the segmenter leg is opt-in. Empty OP_SEGMENTER_URL makes it a
      # documented no-op (see scripts/curation/worker/client.py
      # SegmenterClient). Set OP_SEGMENTER_URL=http://segmenter:8000 to use the
      # `segmenter` service below (`--profile segmenter`), or point it
      # at your own service's `POST /segment` — a comma-separated
      # OP_SEGMENTER_URLS list load-balances across several.
      - OP_SEGMENTER_URL=${OP_SEGMENTER_URL:-}
      - OP_SEGMENTER_URLS=${OP_SEGMENTER_URLS:-}
      - OP_VLM_URL=${OP_VLM_URL:-}
      - OP_VLM_MODEL=${OP_VLM_MODEL:-}
      - OP_VLM_API_KEY=${OP_VLM_API_KEY:-}
      # S-3: lets the worker publish crop.region_verified events to every
      # subscribed SSE client via POST {api_prefix}/events/publish, not
      # just whichever uvicorn worker happened to handle a given POST.
      - OP_EVENT_API_URL=http://yolo-api:8000
    command:
      - python
      - -m
      - scripts.curation.worker
      - --continuous
    healthcheck:
      # S-2: heartbeat file the worker touches every 15s on its main
      # loop (including while idle) — pgrep can't see a deadlocked but
      # still-running event loop.
      test: ["CMD-SHELL", "python /app/src/services/curation/worker_liveness.py check detection_worker --max-age 120"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      - triton-server
      - opensearch
    networks:
      - triton_net

  curation-vlm-worker:
    image: davidamacey/openprocessor:latest
    container_name: ${COMPOSE_PROJECT_NAME:-openprocessor}-vlm-worker
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OP_BUILD_SHA: "${OP_BUILD_SHA:-}"
    profiles:
      - curation
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - openprocessor-state:/var/lib/openprocessor
    environment:
      - OP_API=http://yolo-api:8000
      - OPENSEARCH_URL=http://opensearch:9200
    # G-10: matches yolo-api's extra_hosts -- lets OP_VLM_URL point at
    # http://host.docker.internal:PORT/v1 for an external VLM on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - python
      - -m
      - scripts.curation.vlm_worker
      - --continuous
    healthcheck:
      test: ["CMD-SHELL", "python /app/src/services/curation/worker_liveness.py check vlm_worker --max-age 120"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      yolo-api:
        condition: service_healthy
      opensearch:
        condition: service_started
    networks:
      - triton_net

  curation-auto-label-worker:
    image: davidamacey/openprocessor:latest
    container_name: ${COMPOSE_PROJECT_NAME:-openprocessor}-auto-label-worker
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OP_BUILD_SHA: "${OP_BUILD_SHA:-}"
    profiles:
      - curation
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      # Shared with yolo-api: this is the trigger/state/heartbeat file
      # protocol POST /curation/pipeline/auto_label writes into (see
      # OP_AUTO_LABEL_STATE_DIR, default /jobs/auto_label).
      - openprocessor-jobs:/jobs
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-4}
      - OPENBLAS_NUM_THREADS=${OPENBLAS_NUM_THREADS:-4}
      - MKL_NUM_THREADS=${MKL_NUM_THREADS:-4}
    command:
      - python
      - -m
      - scripts.curation.auto_label_worker
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python /app/src/services/curation/worker_liveness.py check auto_label_worker --max-age 120",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      - opensearch
    networks:
      - triton_net

  curation-cluster-refresh:
    image: davidamacey/openprocessor:latest
    container_name: ${COMPOSE_PROJECT_NAME:-openprocessor}-cluster-refresh
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OP_BUILD_SHA: "${OP_BUILD_SHA:-}"
    profiles:
      - curation
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
    command:
      - python
      - scripts/curation/cluster_refresh_daemon.py
      - --api=http://yolo-api:8000
      - --opensearch=http://opensearch:9200
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python /app/src/services/curation/worker_liveness.py check cluster_refresh --max-age 120",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      yolo-api:
        condition: service_healthy
      opensearch:
        condition: service_started
    networks:
      - triton_net

  # On-demand only (no `restart:` — see docker/evaluator/Dockerfile):
  # `docker compose --profile curation run --rm curation-evaluator`.
  curation-evaluator:
    image: davidamacey/openprocessor-evaluator:latest
    container_name: ${COMPOSE_PROJECT_NAME:-openprocessor}-evaluator
    build:
      context: .
      dockerfile: docker/evaluator/Dockerfile
      args:
        OP_BUILD_SHA: "${OP_BUILD_SHA:-}"
    profiles:
      - curation
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./scripts:/app/scripts:ro
      - ./src:/app/src:ro
      # Exports are eval datasets: same /app/data path as yolo-api, where
      # the API resolved them (OP_EXPORT_ROOT defaults to ./data/exports).
      - ./data:/app/data:ro
      - openprocessor-state:/var/lib/openprocessor
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '0' ]
              capabilities:
                - gpu
    networks:
      - triton_net

  # The detection cascade's segmenter leg (see docker/segmenter/README.md).
  # Its own profile, not `curation`: it needs a GPU of its own plus a
  # HuggingFace token for gated weights, so enabling it is an explicit
  # choice. Leaving it off keeps OP_SEGMENTER_URL empty, which makes the leg a
  # clean no-op (tests/curation/test_sam3_optional.py).
  #
  #   OP_SEGMENTER_URL=http://segmenter:8000 \
  #     docker compose --profile curation --profile segmenter up -d
  segmenter:
    image: davidamacey/openprocessor-segmenter:latest
    container_name: ${COMPOSE_PROJECT_NAME:-openprocessor}-segmenter
    build:
      context: docker/segmenter
      dockerfile: Dockerfile
    profiles:
      - segmenter
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    ports:
      - "${SEGMENTER_PORT:-4611}:8000"  # Segmentation HTTP API
    volumes:
      - ./cache/huggingface:/home/appuser/.cache/huggingface  # ST-2: nvme-backed HF cache (appuser, matches yolo-api)
    environment:
      # Gated weights: the service boots and logs a warning without a
      # token, then fails the download. Set HF_TOKEN in .env.
      - HF_TOKEN=${HF_TOKEN:-}
      - SEGMENTER_DEVICE=${SEGMENTER_DEVICE:-cuda:0}
      - SEGMENTER_INSTANCES=${SEGMENTER_INSTANCES:-2}
      - SEGMENTER_SHARED_WEIGHTS=${SEGMENTER_SHARED_WEIGHTS:-0}
      - SEGMENTER_COMPILE=${SEGMENTER_COMPILE:-0}
      - SEGMENTER_ENABLE_MASKS=${SEGMENTER_ENABLE_MASKS:-1}
    healthcheck:
      # Matches the Dockerfile's probe: /health answers 200 with
      # loaded=false while weights download and the pool builds.
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8000/health | grep -q '\"loaded\":true'",
        ]
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '0' ]
              capabilities:
                - gpu
    networks:
      - triton_net

  # ===================================================================
  # Training pipeline — opt-in via `--profile training` (G3).
  #
  # `POST {api_prefix}/train/start` writes /jobs/<id>.job.json; the
  # trainer below claims it, trains, and writes status/manifest files
  # back into the same volume. The API never RPCs the trainer — the
  # whole contract is those files (src/services/training/jobs.py <->
  # docker/trainer/trainer.py).
  #
  # Kept out of the `curation` profile deliberately: a training run
  # takes a GPU for hours, so starting one must be an explicit act.
  #   docker compose --profile training up -d
  # ===================================================================

  curation-trainer:
    image: davidamacey/openprocessor-trainer:latest
    container_name: ${COMPOSE_PROJECT_NAME:-openprocessor}-trainer
    build:
      context: .
      dockerfile: docker/trainer/Dockerfile
      args:
        OP_BUILD_SHA: "${OP_BUILD_SHA:-}"
    profiles:
      - training
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    volumes:
      # Shared job-file protocol with yolo-api (OP_TRAIN_JOBS_DIR).
      - openprocessor-jobs:/jobs
      # Run outputs (OP_TRAIN_RUNS_ROOT) + bake-off job drop. This MUST be
      # mounted at the same absolute path here and in yolo-api: the trainer
      # records `checkpoint_path` verbatim and promote resolves that exact
      # string from the API container.
      - openprocessor-state:/var/lib/openprocessor
      # Frozen dataset exports. Mounted at the same path yolo-api uses so the
      # absolute `dataset_export_dir` in job.json resolves identically.
      - ./data:/app/data:ro
      # Triton model repo, read-only — only so the incumbent comparison can
      # read a served model's labels.txt (OP_TRITON_MODEL_REPO).
      - ./models:/models:ro
    environment:
      - OP_TRAIN_JOBS_DIR=/jobs
      - OP_TRAIN_RUNS_ROOT=/var/lib/openprocessor/training_runs
      # G-14: MUST match `device_ids` below, in the same order: the job spec
      # names HOST gpu ids, which appear inside the container as positional
      # local indices. See docker/trainer/trainer.py::resolve_local_device.
      - OP_TRAIN_GPU_ORDER=${OP_TRAIN_GPU_ORDER:-0}
      - OP_API_BASE_URL=http://yolo-api:8000
      - OP_API_PREFIX=${OP_API_PREFIX:-/curation}
      - OP_TRITON_HTTP_URL=http://triton-server:8000
      - OP_TRITON_MODEL_REPO=/models
      - MLFLOW_TRACKING_URI=http://curation-mlflow:5000
      - MLFLOW_EXPERIMENT_NAME=${MLFLOW_EXPERIMENT_NAME:-openprocessor}
    shm_size: 8g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # G-14: single-GPU default, interpolated from the same var as
              # OP_TRAIN_GPU_ORDER above. Compose can't cleanly expand a
              # comma-separated OP_TRAIN_GPU_ORDER (e.g. "0,2") into
              # multiple device_ids list entries from one scalar var --
              # a multi-GPU deployment sets both in a docker-compose
              # override file (device_ids: ['0', '2']) instead.
              device_ids: [ '${OP_TRAIN_GPU_ORDER:-0}' ]
              capabilities:
                - gpu
    depends_on:
      - yolo-api
    networks:
      - triton_net

  # Experiment tracking for training runs. Optional: every MLflow hook in
  # docker/trainer/mlflow_callbacks.py degrades to a warning when this is
  # unreachable, so a deployment that doesn't want it can leave it stopped.
  curation-mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: ${COMPOSE_PROJECT_NAME:-openprocessor}-mlflow
    profiles:
      - training
    restart: unless-stopped
    command:
      # ML-1: serve artifacts through the tracking server's HTTP proxy
      # instead of a bare local path. The trainer container never mounts
      # the `mlflow_data` volume, so a local `--default-artifact-root`
      # makes every `mlflow.log_artifact(...)` call in
      # `on_train_end` (uninstrumented in Ultralytics' own MLflow
      # integration) raise PermissionError and fail the run at the last
      # step. `mlflow-artifacts:/` routes the upload over the network
      # connection the trainer already has (MLFLOW_TRACKING_URI).
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination=/mlflow/artifacts
      - --default-artifact-root=mlflow-artifacts:/
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "${MLFLOW_PORT:-4609}:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    networks:
      - triton_net

  # G-10: optional in-compose VLM (Gemma 4 E4B) for the labeling/verify
  # legs (OP_VLM_URL). Off by default -- most deployments either have no
  # VLM yet or already run one elsewhere (set OP_VLM_URL to point at it;
  # see the host.docker.internal extra_hosts on yolo-api /
  # curation-vlm-worker for "VLM runs on the host, not in this compose
  # project"). Enable with `docker compose --profile vlm up -d vlm` and
  # set OP_VLM_URL=http://vlm:8000/v1 in .env.
  #
  # `--limit-mm-per-prompt` (images per request the *server* accepts) and
  # OP_VLM_MAX_IMAGES_PER_CALL (images per request the *API/workers send*,
  # see env.template) are two ends of the same contract -- a client value
  # above the server's limit gets a 400 on every call. Keep them equal;
  # VLM_LIMIT_MM_IMAGES below defaults to the same 8 as
  # OP_VLM_MAX_IMAGES_PER_CALL's default.
  vlm:
    # Pin, don't float on :latest -- an untested vLLM bump can silently
    # change chat-template / tool-call-parser behavior. Confirm this tag
    # supports Gemma 4's multimodal (image) input for your GPU/CUDA combo
    # before relying on it; see vLLM's release notes.
    image: ${VLM_IMAGE:-vllm/vllm-openai:v0.11.0}
    container_name: ${COMPOSE_PROJECT_NAME:-openprocessor}-vlm
    profiles:
      - vlm
    restart: unless-stopped
    ipc: host
    shm_size: 8g
    ulimits:
      memlock: -1
      stack: 67108864
    ports:
      - "${VLM_PORT:-4612}:8000"
    volumes:
      - ./cache/vllm:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    command:
      - --model=${VLM_MODEL:-google/gemma-4-E4B-it}
      - --served-model-name=${VLM_SERVED_MODEL_NAME:-gemma-4-e4b}
      - --dtype=${VLM_DTYPE:-bfloat16}
      - --max-model-len=${VLM_MAX_MODEL_LEN:-8192}
      # Fraction of this GPU's VRAM vLLM may claim. Lower it to share the
      # GPU with Triton/the segmenter/training; see docs/CURATION.md
      # "VLM VRAM budget" for worked numbers per card size.
      - --gpu-memory-utilization=${VLM_GPU_MEMORY_UTILIZATION:-0.4}
      # See the module comment above: keep this equal to
      # OP_VLM_MAX_IMAGES_PER_CALL.
      - --limit-mm-per-prompt={"image":${VLM_LIMIT_MM_IMAGES:-8},"audio":0}
      - --chat-template=/vllm-workspace/examples/tool_chat_template_gemma4.jinja
      - --reasoning-parser=gemma4
      - --enable-prefix-caching
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '${VLM_GPU_ID:-0}' ]
              capabilities:
                - gpu
    networks:
      - triton_net

  triton-sdk:
    image: nvcr.io/nvidia/tritonserver:26.06-py3-sdk
    container_name: ${COMPOSE_PROJECT_NAME:-openprocessor}-sdk
    profiles:
      - benchmark
    command: sleep infinity
    volumes:
      - ./benchmarks:/workspace/benchmarks
      - ./models:/models
    networks:
      - triton_net

  node-exporter:
    image: prom/node-exporter:v1.10.2
    container_name: ${COMPOSE_PROJECT_NAME:-openprocessor}-node-exporter
    restart: always
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - '/:/host:ro,rslave'
    networks:
      - triton_net

  # Per-GPU utilization / VRAM / power / temperature for Grafana across ALL
  # host GPUs (not just Triton's). Read-only; does not reserve compute.
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.0-ubuntu22.04
    container_name: ${COMPOSE_PROJECT_NAME:-openprocessor}-dcgm
    restart: always
    cap_add:
      - SYS_ADMIN
    environment:
      - DCGM_EXPORTER_LISTEN=:9400
    ports:
      - "${DCGM_PORT:-4610}:9400"  # DCGM GPU metrics
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]
    networks:
      - triton_net

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: ${COMPOSE_PROJECT_NAME:-openprocessor}-prometheus
    restart: always
    ports:
      - "${PROMETHEUS_PORT:-4604}:9090"  # Prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts:/etc/prometheus/alerts
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - triton_net
    depends_on:
      - triton-server
      - node-exporter

  grafana:
    image: grafana/grafana:13.1.0
    container_name: ${COMPOSE_PROJECT_NAME:-openprocessor}-grafana
    restart: always
    ports:
      - "${GRAFANA_PORT:-4605}:3000"  # Grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./monitoring/grafana-alerting.yml:/etc/grafana/provisioning/alerting/alerting.yml
      - ./monitoring/dashboards:/etc/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      # Enable unified alerting (Grafana 8+)
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_ALERTING_ENABLED=false
    networks:
      - triton_net
    depends_on:
      - prometheus
      - loki

  loki:
    # Runs as the image's builtin non-root user (uid 10001). Existing
    # root-owned loki_data volumes need a one-time chown — see
    # docs/MIGRATION_TRITON_26.md.
    image: grafana/loki:3.6.12
    container_name: ${COMPOSE_PROJECT_NAME:-openprocessor}-loki
    restart: always
    ports:
      - "${LOKI_PORT:-4606}:3100"  # Loki
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - triton_net

# Log shipper: Grafana Alloy (Promtail reached EOL 2026-03-02).
  alloy:
    image: grafana/alloy:v1.17.1
    container_name: ${COMPOSE_PROJECT_NAME:-openprocessor}-alloy
    restart: always
    volumes:
      - ./monitoring/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/tmp/alloy
    networks:
      - triton_net
    depends_on:
      - loki

  # ===================================================================
  # OpenSearch for Visual Search (Vector Database)
  # OpenSearch 3.x with k-NN plugin for vector similarity search
  # ===================================================================
  opensearch:
    image: opensearchproject/opensearch:3.6.0
    container_name: ${COMPOSE_PROJECT_NAME:-openprocessor}-opensearch
    restart: always
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"  # Heap size (adjust based on RAM)
      - DISABLE_SECURITY_PLUGIN=true  # Disable security for dev (enable in production)
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "${OPENSEARCH_PORT:-4607}:9200"  # REST API
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:9200 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
    networks:
      - triton_net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.6.0
    container_name: ${COMPOSE_PROJECT_NAME:-openprocessor}-osd
    restart: always
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true  # Must match OpenSearch security setting
    ports:
      - "${OPENSEARCH_DASHBOARDS_PORT:-4608}:5601"  # OpenSearch Dashboards
    volumes:
      - opensearch_dashboards_data:/usr/share/opensearch-dashboards/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:5601 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks:
      - triton_net
    depends_on:
      opensearch:
        condition: service_healthy

networks:
  triton_net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  opensearch_data:
  opensearch_dashboards_data:
  openprocessor-state:
  openprocessor-jobs:
  mlflow_data:
  # ST-1: shared tmpfs item-crop cache (yolo-api + curation-detection-worker).
  # Size is the OS-level ceiling; OP_CROP_CACHE_MAX_BYTES (default 3 GiB,
  # see CurationConfig.crop_cache_max_bytes) prunes the *content* down
  # before this fills.
  openprocessor-crop-cache:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=4g,uid=1000,gid=999,mode=0770"
