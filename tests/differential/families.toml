# Operation to family: which route family owns each operation of the contracts (docs/design/v070_rebuild/18a_backend_rust_port_slices.md, 3.2).
#
# Every operation of every contracts/openapi/*.json file present must land in exactly one family
# (tests/differential/test_families.py); the loader and the pattern rules are in families.py.
#   contract  the contract file the family's operations live in (curation or core)
#   slice     the slice that ports the family and removes its Python handlers
#   fixtures  providers (tests/differential/providers/) that supply parameter values present in both
#             stacks, for the family's path and query parameters
#   paths     "[METHOD[,METHOD] ]<path>"; "<path>/*" is a prefix, anything else exact; the most specific wins
# `{project}` etc. are the contract's own path templates, matched as written.
#
# The curation part is built from the 388 operations of curation.json and the slice map of plan 18b
# section 7.1. The core part is built from the route prefixes in CLAUDE.md, NOT from core.json (the
# lane that writes it had not merged): it is unverified until that file lands, and the first run of
# test_families.py against it names every operation it misses. A slice may move an operation to its own
# family in the slice's commit; the test keeps the mapping total.


[[family]]
name = "projects"
contract = "curation"
slice = "R11a"
fixtures = ["projects"]
# create, list, read, update, delete, archive: the project record. `fixtures` shows the worked example
paths = [
  "/curation/projects",
  "/curation/projects/{project}",
  "/curation/projects/{project}/archive",
  "/curation/projects/{project}/unarchive",
]

[[family]]
name = "project_combine"
contract = "curation"
slice = "R9"
# combine several projects into a new one
paths = [
  "/curation/projects/combine/*",
]

[[family]]
name = "ingest"
contract = "curation"
slice = "R1c"
# upload, batch, objects, bulk, sources, path lookup, status; image_counts/backfill is deleted in the slice
paths = [
  "/curation/projects/{project}/ingest/*",
  "/curation/projects/{project}/image_counts/*",
  "/curation/projects/{project}/source_backfill/*",
]

[[family]]
name = "gallery"
contract = "curation"
slice = "R4"
# reads of photos, objects, crops, thumbnails, map, table, projection
paths = [
  "GET /curation/projects/{project}/crops/*",
  "/curation/projects/{project}/images/*",
  "/curation/projects/{project}/map/*",
  "/curation/projects/{project}/table/*",
  "/curation/projects/{project}/viz/*",
]

[[family]]
name = "labelling"
contract = "curation"
slice = "R5"
# labelling acts, undo, review, classes, counts. Writes on crops are acts; reads on crops are gallery
paths = [
  "POST,PUT,PATCH,DELETE /curation/projects/{project}/crops/*",
  "/curation/projects/{project}/classes/*",
  "/curation/projects/{project}/class_sources",
  "/curation/projects/{project}/review/*",
  "/curation/projects/{project}/label_ops/*",
  "/curation/projects/{project}/select/*",
  "/curation/projects/{project}/selection/*",
  "/curation/projects/{project}/scores/*",
  "/curation/projects/{project}/stats/*",
  "/curation/projects/{project}/detections/*",
  "/curation/projects/{project}/exclude_reasons",
  "/curation/projects/{project}/next_steps",
  "/curation/projects/{project}/quality/*",
]

[[family]]
name = "erasure"
contract = "curation"
slice = "R5e"
# privacy audit
paths = [
  "/curation/projects/{project}/audit/*",
]

[[family]]
name = "search_embedding"
contract = "curation"
slice = "R6a"
paths = [
  "/curation/projects/{project}/search/*",
  "/curation/projects/{project}/embedding/*",
]

[[family]]
name = "near_duplicates"
contract = "curation"
slice = "R6b"
paths = [
  "/curation/projects/{project}/near_duplicates/*",
]

[[family]]
name = "regions"
contract = "curation"
slice = "R7"
# the region stage; ingest/region_drain is more specific than the ingest prefix
paths = [
  "/curation/projects/{project}/regions/*",
  "/curation/projects/{project}/region_stage/*",
  "/curation/projects/{project}/ingest/region_drain",
]

[[family]]
name = "clusters"
contract = "curation"
slice = "R8"
paths = [
  "/curation/projects/{project}/clusters/*",
  "/curation/projects/{project}/cluster/*",
]

[[family]]
name = "training_export"
contract = "curation"
slice = "R9"
# dataset import, export, training, promotion and the models they produce
paths = [
  "/curation/projects/{project}/datasets/*",
  "/curation/projects/{project}/export/*",
  "/curation/projects/{project}/train/*",
  "/curation/projects/{project}/models/*",
  "/curation/projects/{project}/training_cohorts/*",
  "/curation/projects/{project}/test_holdout/*",
]

[[family]]
name = "assist"
contract = "curation"
slice = "R10"
# the assist loop, open vocabulary, auto-label pipeline, reprocess, probe and the VLM batch calls
paths = [
  "/curation/projects/{project}/assist/*",
  "/curation/projects/{project}/assist_loop_presets/*",
  "/curation/projects/{project}/open_vocab/*",
  "/curation/projects/{project}/pipeline/*",
