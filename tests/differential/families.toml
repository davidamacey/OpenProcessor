  "/curation/projects/{project}/clone_settings",
  "/curation/projects/{project}/methods",
  "/curation/projects/{project}/config/*",
  "/curation/projects/{project}/bakeoff/*",
  "/curation/projects/{project}/health",
  "/curation/health",
  "/curation/embedding/models",
  "/curation/projects/{project}/ingest/config",
  "/curation/projects/{project}/ingest/policy/*",
