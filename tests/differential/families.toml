contract = "core"
slice = "R2a"
# engine-backed routes; the faces search and identify routes belong to core_store in 18b, split here when core.json shows them
paths = [
  "/detect/*",
  "/v1/detect/*",
  "/analyze/*",
  "/v1/analyze/*",
  "/ocr/*",
  "/v1/ocr/*",
  "/embed/*",
  "/v1/embed/*",
  "/faces/*",
  "/v1/faces/*",
]

[[family]]
name = "core_store"
contract = "core"
